---
- name: Create Postgres
  hosts: all
  become: yes
  tasks:
    - name: Create postgres_data directory
      file:
        path: /home/code/postgres_data
        state: directory

    - name: Copy docker-compose file
      ansible.builtin.template:
        src: docker-compose.postgres.yaml.j2
        dest: /home/code/docker-compose.postgres.yaml

    - name: Run Postgres service
      shell: docker stack deploy --compose-file=/home/code/docker-compose.postgres.yaml postgres

    - name: Wait for Postgres service ready state
      shell: >
        docker service ls --filter name=postgres_postgres --format '{% raw %}{{.Replicas}}{% endraw %}'
      register: postgres_service_status
      until: postgres_service_status.stdout | trim != "" and postgres_service_status.stdout | trim == "1/1"
      retries: 20
      delay: 5
      changed_when: false

    - name: Find running Postgres container
      shell: >
        docker ps
        --filter label=com.docker.swarm.service.name=postgres_postgres
        --format '{% raw %}{{.ID}}{% endraw %}'
        | head -n 1
      args:
        executable: /bin/bash
      register: postgres_container_id
      until: postgres_container_id.stdout | trim | length > 0
      retries: 10
      delay: 3
      changed_when: false

    - name: Verify Postgres accepts internal connections
      shell: |
        docker exec \
          "{{ postgres_container_id.stdout | trim }}" \
          /bin/sh \
          -c 'exec pg_isready --host 127.0.0.1 --port 5432 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB"'
      register: postgres_ready
      until: postgres_ready.rc == 0
      retries: 10
      delay: 3
      changed_when: false
      no_log: true
