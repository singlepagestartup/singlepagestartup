---
- name: Fill Postgres settings in GitHub
  hosts: all
  become: yes
  vars:
    github_token: "{{ GITHUB_TOKEN }}"
    github_repository: "{{ GITHUB_REPOSITORY }}"
    environment_type: "{{ ENVIRONMENT_TYPE }}"
  tasks:
    - name: Delete artifacts
      file:
        path: /home/code/github-node-api/
        state: absent

    - name: Set ENVIRONMENT_TYPE_PREFIX
      set_fact:
        ENVIRONMENT_TYPE_PREFIX: "{{ environment_type | default('') ~ '_' if environment_type else '' }}"

    - name: Create github-node-api directory
      file:
        path: "/home/code/github-node-api"
        state: directory

    - name: Fill github-node-api directory from local
      copy:
        src: "{{ playbook_dir }}/../github/github-node-api/{{ item }}"
        dest: "/home/code/github-node-api/{{ item }}"
      loop:
        - create_secret.js
        - create_variable.js
        - package.json

    - name: Install dependencies
      shell:
        cmd: "npm install"
        chdir: "/home/code/github-node-api"

    - name: Set variables in GitHub
      no_log: true
      ansible.builtin.command:
        argv: [node, ./create_variable.js]
        stdin: >-
          {{ {
            'GITHUB_TOKEN': github_token,
            'GITHUB_REPOSITORY': github_repository,
            'VARIABLE_NAME': item.variable_name,
            'VARIABLE_CONTENT': item.variable_content
          } | to_json }}
        chdir: "/home/code/github-node-api"
      loop:
        - {
            variable_name: "{{ ENVIRONMENT_TYPE_PREFIX ~ 'DATABASE_HOST' }}",
            variable_content: "{{ inventory_hostname }}",
          }

    - name: Delete artifacts
      file:
        path: /home/code/github-node-api/
        state: absent
