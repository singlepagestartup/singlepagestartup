---
- name: Fill host settings in GitHub
  hosts: all
  become: yes
  vars:
    github_token: "{{ GITHUB_TOKEN }}"
    github_repository: "{{ GITHUB_REPOSITORY }}"
    portainer_url: "{{ PORTAINER_URL }}"
    service_url: "{{ SERVICE_URL }}"
    environment_type: "{{ ENVIRONMENT_TYPE }}"
    api_service_url: "{{ API_SERVICE_URL }}"
  tasks:
    - name: Delete artifacts
      file:
        path: /home/code/github-node-api/
        state: absent

    - name: Set ENVIRONMENT_TYPE_PREFIX
      set_fact:
        ENVIRONMENT_TYPE_PREFIX: "{{ environment_type | default('') ~ '_' if environment_type else '' }}"

    - name: Create github-node-api directory
      file:
        path: "/home/code/github-node-api"
        state: directory

    - name: Fill github-node-api directory from local
      copy:
        src: "{{ playbook_dir }}/../github/github-node-api/{{ item }}"
        dest: "/home/code/github-node-api/{{ item }}"
      loop:
        - create_secret.js
        - create_variable.js
        - package.json

    - name: Install dependencies
      shell:
        cmd: "npm install"
        chdir: "/home/code/github-node-api"

    - name: Get Portainer host webhook token
      shell:
        cmd: "cat /home/code/host_webhook_token"
      register: host_webhook_token

    - name: Set variables in GitHub
      no_log: true
      ansible.builtin.command:
        argv: [node, ./create_variable.js]
        stdin: >-
          {{ {
            'GITHUB_TOKEN': github_token,
            'GITHUB_REPOSITORY': github_repository,
            'VARIABLE_NAME': item.variable_name,
            'VARIABLE_CONTENT': item.variable_content
          } | to_json }}
        chdir: "/home/code/github-node-api"
      loop:
        - {
            variable_name: "{{ ENVIRONMENT_TYPE_PREFIX ~ 'NEXT_PUBLIC_HOST_SERVICE_URL' }}",
            variable_content: "https://{{ service_url }}",
          }
        - {
            variable_name: "{{ ENVIRONMENT_TYPE_PREFIX ~ 'NEXT_PUBLIC_API_SERVICE_URL' }}",
            variable_content: "https://{{ api_service_url }}",
          }
        - {
            variable_name: "{{ ENVIRONMENT_TYPE_PREFIX ~ 'API_SERVICE_URL' }}",
            variable_content: "http://api:4000",
          }
        - {
            variable_name: "{{ ENVIRONMENT_TYPE_PREFIX ~ 'NEXT_PUBLIC_API_SERVICE_WS_URL' }}",
            variable_content: "wss://{{ api_service_url }}",
          }

    - name: Set secrets to GitHub
      no_log: true
      ansible.builtin.command:
        argv: [node, ./create_secret.js]
        stdin: >-
          {{ {
            'GITHUB_TOKEN': github_token,
            'GITHUB_REPOSITORY': github_repository,
            'SECRET_NAME': item.secret_name,
            'SECRET_SCOPE': item.secret_scope,
            'SECRET_CONTENT': item.secret_content
          } | to_json }}
        chdir: "/home/code/github-node-api"
      loop:
        - {
            secret_name: "{{ ENVIRONMENT_TYPE_PREFIX ~ 'PORTAINER_HOST_UPDATE_URL' }}",
            secret_content: "https://{{ portainer_url }}/api/webhooks/{{ host_webhook_token.stdout }}",
            secret_scope: actions,
          }

    - name: Delete artifacts
      file:
        path: /home/code/github-node-api/
        state: absent
