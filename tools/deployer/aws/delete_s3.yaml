---
- name: Delete configured empty S3 buckets
  hosts: all
  become: yes
  vars:
    root_aws_access_key_id: "{{ ROOT_AWS_ACCESS_KEY_ID }}"
    root_aws_secret_access_key: "{{ ROOT_AWS_SECRET_ACCESS_KEY }}"
    aws_region: "{{ AWS_REGION }}"
    aws_s3_bucket_name: "{{ AWS_S3_BUCKET_NAME | default('') | trim }}"
    aws_s3_dev_bucket_name: "{{ AWS_S3_DEV_BUCKET_NAME | default('') | trim }}"
  tasks:
    - name: Remove configured S3 buckets
      when: aws_s3_bucket_name | length > 0 or aws_s3_dev_bucket_name | length > 0
      block:
        - name: Install required Python packages
          pip:
            name:
              - boto
              - boto3
              - botocore
              - awscli
            state: present
            virtualenv: /opt/venv

        - name: Delete S3 bucket
          amazon.aws.s3_bucket:
            name: "{{ item }}"
            access_key: "{{ root_aws_access_key_id }}"
            secret_key: "{{ root_aws_secret_access_key }}"
            region: "{{ aws_region }}"
            state: absent
            force: false
          loop:
            - "{{ aws_s3_bucket_name }}"
            - "{{ aws_s3_dev_bucket_name }}"
          when: item | length > 0

        - name: Delete S3 name file
          file:
            path: "/home/code/{{ item.name }}.env"
            state: absent
          loop:
            - { name: "s3_bucket", bucket: "{{ aws_s3_bucket_name }}" }
            - { name: "s3_bucket_dev", bucket: "{{ aws_s3_dev_bucket_name }}" }
          when: item.bucket | length > 0
