---
- name: Set cron jobs
  hosts: all
  become: yes
  vars:
    api_service_url: "{{ API_SERVICE_URL }}"
    agent_cron_secret: "{{ AGENT_CRON_SECRET }}"
  tasks:
    # The job sends AGENT_CRON_SECRET, which opens the agent cron route and
    # nothing else. curl verifies the certificate; "Agent cron" in
    # tools/deployer/README.md covers a host whose certificate it cannot verify.
    - name: agent service cron
      cron:
        name: "agent service cron"
        minute: "*"
        job:
          "curl -X POST https://{{ api_service_url }}/api/agent/agents/cron \
          -H 'X-AGENT-CRON-SECRET: {{ agent_cron_secret }}' \
          -F 'data={}' >> /home/code/api_agent_agents_cron.log 2>&1"
      no_log: true
