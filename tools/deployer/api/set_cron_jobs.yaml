---
- name: Set cron jobs
  hosts: all
  become: yes
  vars:
    api_service_url: "{{ API_SERVICE_URL }}"
  tasks:
    - name: agent service cron
      cron:
        name: "agent service cron"
        minute: "*"
        job: >-
          curl --fail --silent --show-error --request POST
          'https://{{ api_service_url }}/api/agent/agents/cron'
          >> /home/code/api_agent_agents_cron.log 2>&1
