---
- name: Create Redis
  hosts: all
  become: yes
  tasks:
    - name: Validate Redis password
      assert:
        that:
          - REDIS_PASSWORD is defined
          - REDIS_PASSWORD | length > 0
        fail_msg: REDIS_PASSWORD must be set before Redis deployment
      no_log: true

    - name: Create redis_data directory
      file:
        path: /home/code/redis_data
        state: directory

    - name: Copy docker-compose file
      ansible.builtin.template:
        src: docker-compose.redis.yaml.j2
        dest: /home/code/docker-compose.redis.yaml

    - name: Run Redis service
      shell: docker stack deploy --compose-file=/home/code/docker-compose.redis.yaml redis

    - name: Wait for Redis service update completion
      shell: >
        docker service inspect redis_redis
        --format '{% raw %}{{if .UpdateStatus}}{{.UpdateStatus.State}}{{else}}completed{{end}}{% endraw %}'
      register: redis_update_status
      until: redis_update_status.stdout | trim == "completed"
      retries: 20
      delay: 5
      changed_when: false

    - name: Wait for Redis service ready state
      shell: >
        docker service ls --filter name=redis_redis --format '{% raw %}{{.Replicas}}{% endraw %}'
      register: redis_service_status
      until: redis_service_status.stdout | trim != "" and redis_service_status.stdout | trim == "1/1"
      retries: 20
      delay: 5
      changed_when: false

    - name: Find container for current Redis service task
      shell: |
        task_id="$(
          docker service ps redis_redis \
            --filter desired-state=running \
            --format '{% raw %}{{.ID}}{% endraw %}' \
          | head -n 1
        )"
        if [ -z "$task_id" ]; then
          exit 1
        fi
        docker ps \
          --filter "label=com.docker.swarm.task.id=$task_id" \
          --format '{% raw %}{{.ID}}{% endraw %}' \
        | head -n 1
      args:
        executable: /bin/bash
      register: redis_container_id
      until: redis_container_id.stdout | trim | length > 0
      retries: 10
      delay: 3
      changed_when: false

    - name: Verify Redis rejects unauthenticated commands
      shell: |
        set -o pipefail
        response="$(
          docker exec \
            "{{ redis_container_id.stdout | trim }}" \
            redis-cli \
            -p "{{ REDIS_PORT | default('6379', true) }}" \
            ping 2>&1 || true
        )"
        grep -q "NOAUTH" <<< "$response"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Verify Redis accepts the protected credential
      shell: |
        docker exec \
          "{{ redis_container_id.stdout | trim }}" \
          /bin/sh \
          -c 'REDISCLI_AUTH="$REDIS_PASSWORD" exec redis-cli -p "${REDIS_PORT:-6379}" --no-auth-warning ping'
      register: redis_authenticated_ping
      changed_when: false
      no_log: true

    - name: Validate authenticated Redis response
      assert:
        that:
          - redis_authenticated_ping.stdout | trim == "PONG"
        fail_msg: Redis did not accept the protected credential
      no_log: true
