name: Build Docker image

on:
  workflow_dispatch:
    inputs:
      TAG:
        description: Docker image tag
        required: true
        type: string
      PRERELEASE:
        description: Use preview image repositories
        required: true
        default: true
        type: boolean
      VERIFY_ONLY:
        description: Build without publishing images or deploying services
        required: true
        default: true
        type: boolean
  workflow_call:
    inputs:
      TAG:
        required: true
        type: string
      PRERELEASE:
        required: true
        type: boolean
      VERIFY_ONLY:
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-docker-image:
    name: Build Docker image
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
    steps:
      - name: Check out repository code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set environment variables based on PRERELEASE
        env:
          VERIFY_ONLY: ${{ inputs.VERIFY_ONLY }}
          PRERELEASE: ${{ inputs.PRERELEASE }}
          NEXT_PUBLIC_API_SERVICE_URL: ${{ vars.NEXT_PUBLIC_API_SERVICE_URL }}
          NEXT_PUBLIC_API_SERVICE_WS_URL: ${{ vars.NEXT_PUBLIC_API_SERVICE_WS_URL }}
          NEXT_PUBLIC_HOST_SERVICE_URL: ${{ vars.NEXT_PUBLIC_HOST_SERVICE_URL }}
          YANDEX_METRIKA_ID: ${{ vars.YANDEX_METRIKA_ID }}
          PREVIEW_DOCKER_HUB_URL: ${{ vars.PREVIEW_DOCKER_HUB_URL }}
          PREVIEW_HOST_SERVICE_DOCKER_HUB_REPOSITORY_NAME: ${{ vars.PREVIEW_HOST_SERVICE_DOCKER_HUB_REPOSITORY_NAME }}
          PREVIEW_API_SERVICE_DOCKER_HUB_REPOSITORY_NAME: ${{ vars.PREVIEW_API_SERVICE_DOCKER_HUB_REPOSITORY_NAME }}
          PREVIEW_TELEGRAM_SERVICE_DOCKER_HUB_REPOSITORY_NAME: ${{ vars.PREVIEW_TELEGRAM_SERVICE_DOCKER_HUB_REPOSITORY_NAME }}
          PREVIEW_LLM_SERVICE_DOCKER_HUB_REPOSITORY_NAME: ${{ vars.PREVIEW_LLM_SERVICE_DOCKER_HUB_REPOSITORY_NAME }}
          PREVIEW_MCP_SERVICE_DOCKER_HUB_REPOSITORY_NAME: ${{ vars.PREVIEW_MCP_SERVICE_DOCKER_HUB_REPOSITORY_NAME }}
          PREVIEW_DOCKER_HUB_USERNAME: ${{ vars.PREVIEW_DOCKER_HUB_USERNAME }}
          PREVIEW_DOCKER_HUB_PASSWORD: ${{ secrets.PREVIEW_DOCKER_HUB_PASSWORD }}
          PREVIEW_NEXT_PUBLIC_API_SERVICE_URL: ${{ vars.PREVIEW_NEXT_PUBLIC_API_SERVICE_URL }}
          PREVIEW_NEXT_PUBLIC_API_SERVICE_WS_URL: ${{ vars.PREVIEW_NEXT_PUBLIC_API_SERVICE_WS_URL }}
          PREVIEW_NEXT_PUBLIC_HOST_SERVICE_URL: ${{ vars.PREVIEW_NEXT_PUBLIC_HOST_SERVICE_URL }}
          PREVIEW_YANDEX_METRIKA_ID: ${{ vars.PREVIEW_YANDEX_METRIKA_ID }}
          DOCKER_HUB_URL: ${{ vars.DOCKER_HUB_URL }}
          HOST_SERVICE_DOCKER_HUB_REPOSITORY_NAME: ${{ vars.HOST_SERVICE_DOCKER_HUB_REPOSITORY_NAME }}
          API_SERVICE_DOCKER_HUB_REPOSITORY_NAME: ${{ vars.API_SERVICE_DOCKER_HUB_REPOSITORY_NAME }}
          TELEGRAM_SERVICE_DOCKER_HUB_REPOSITORY_NAME: ${{ vars.TELEGRAM_SERVICE_DOCKER_HUB_REPOSITORY_NAME }}
          LLM_SERVICE_DOCKER_HUB_REPOSITORY_NAME: ${{ vars.LLM_SERVICE_DOCKER_HUB_REPOSITORY_NAME }}
          MCP_SERVICE_DOCKER_HUB_REPOSITORY_NAME: ${{ vars.MCP_SERVICE_DOCKER_HUB_REPOSITORY_NAME }}
          DOCKER_HUB_USERNAME: ${{ vars.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
        run: |
          settings=()
          if [ "$VERIFY_ONLY" = "true" ]; then
            settings+=("NEXT_PUBLIC_API_SERVICE_URL=${NEXT_PUBLIC_API_SERVICE_URL}")
            settings+=("NEXT_PUBLIC_API_SERVICE_WS_URL=${NEXT_PUBLIC_API_SERVICE_WS_URL}")
            settings+=("NEXT_PUBLIC_HOST_SERVICE_URL=${NEXT_PUBLIC_HOST_SERVICE_URL}")
            settings+=("YANDEX_METRIKA_ID=${YANDEX_METRIKA_ID}")
          elif [ "$PRERELEASE" = "true" ]; then
            settings+=("DOCKER_HUB_URL=${PREVIEW_DOCKER_HUB_URL}")
            settings+=("HOST_SERVICE_DOCKER_HUB_REPOSITORY_NAME=${PREVIEW_HOST_SERVICE_DOCKER_HUB_REPOSITORY_NAME}")
            settings+=("API_SERVICE_DOCKER_HUB_REPOSITORY_NAME=${PREVIEW_API_SERVICE_DOCKER_HUB_REPOSITORY_NAME}")
            settings+=("TELEGRAM_SERVICE_DOCKER_HUB_REPOSITORY_NAME=${PREVIEW_TELEGRAM_SERVICE_DOCKER_HUB_REPOSITORY_NAME}")
            settings+=("LLM_SERVICE_DOCKER_HUB_REPOSITORY_NAME=${PREVIEW_LLM_SERVICE_DOCKER_HUB_REPOSITORY_NAME}")
            settings+=("MCP_SERVICE_DOCKER_HUB_REPOSITORY_NAME=${PREVIEW_MCP_SERVICE_DOCKER_HUB_REPOSITORY_NAME}")
            settings+=("DOCKER_HUB_USERNAME=${PREVIEW_DOCKER_HUB_USERNAME}")
            settings+=("DOCKER_HUB_PASSWORD=${PREVIEW_DOCKER_HUB_PASSWORD}")
            settings+=("NEXT_PUBLIC_API_SERVICE_URL=${PREVIEW_NEXT_PUBLIC_API_SERVICE_URL}")
            settings+=("NEXT_PUBLIC_API_SERVICE_WS_URL=${PREVIEW_NEXT_PUBLIC_API_SERVICE_WS_URL}")
            settings+=("NEXT_PUBLIC_HOST_SERVICE_URL=${PREVIEW_NEXT_PUBLIC_HOST_SERVICE_URL}")
            settings+=("YANDEX_METRIKA_ID=${PREVIEW_YANDEX_METRIKA_ID}")
          else
            settings+=("DOCKER_HUB_URL=${DOCKER_HUB_URL}")
            settings+=("HOST_SERVICE_DOCKER_HUB_REPOSITORY_NAME=${HOST_SERVICE_DOCKER_HUB_REPOSITORY_NAME}")
            settings+=("API_SERVICE_DOCKER_HUB_REPOSITORY_NAME=${API_SERVICE_DOCKER_HUB_REPOSITORY_NAME}")
            settings+=("TELEGRAM_SERVICE_DOCKER_HUB_REPOSITORY_NAME=${TELEGRAM_SERVICE_DOCKER_HUB_REPOSITORY_NAME}")
            settings+=("LLM_SERVICE_DOCKER_HUB_REPOSITORY_NAME=${LLM_SERVICE_DOCKER_HUB_REPOSITORY_NAME}")
            settings+=("MCP_SERVICE_DOCKER_HUB_REPOSITORY_NAME=${MCP_SERVICE_DOCKER_HUB_REPOSITORY_NAME}")
            settings+=("DOCKER_HUB_USERNAME=${DOCKER_HUB_USERNAME}")
            settings+=("DOCKER_HUB_PASSWORD=${DOCKER_HUB_PASSWORD}")
            settings+=("NEXT_PUBLIC_API_SERVICE_URL=${NEXT_PUBLIC_API_SERVICE_URL}")
            settings+=("NEXT_PUBLIC_API_SERVICE_WS_URL=${NEXT_PUBLIC_API_SERVICE_WS_URL}")
            settings+=("NEXT_PUBLIC_HOST_SERVICE_URL=${NEXT_PUBLIC_HOST_SERVICE_URL}")
            settings+=("YANDEX_METRIKA_ID=${YANDEX_METRIKA_ID}")
          fi

          for setting in "${settings[@]}"; do
            if [[ "$setting" == *$'\n'* || "$setting" == *$'\r'* ]]; then
              echo "${setting%%=*} must be a single-line value" >&2
              exit 1
            fi
            printf '%s\n' "$setting" >> "$GITHUB_ENV"
          done

      - name: Set image tags
        if: ${{ !inputs.VERIFY_ONLY }}
        id: image-tags
        env:
          IMAGE_TAG: ${{ inputs.TAG }}
        run: |
          repos=(
            "$HOST_SERVICE_DOCKER_HUB_REPOSITORY_NAME"
            "$API_SERVICE_DOCKER_HUB_REPOSITORY_NAME"
            "$TELEGRAM_SERVICE_DOCKER_HUB_REPOSITORY_NAME"
            "$LLM_SERVICE_DOCKER_HUB_REPOSITORY_NAME"
            "$MCP_SERVICE_DOCKER_HUB_REPOSITORY_NAME"
          )

          unique_repos=()
          for repo in "${repos[@]}"; do
            if [ -z "$repo" ]; then
              continue
            fi

            duplicate=false
            for existing_repo in "${unique_repos[@]}"; do
              if [ "$existing_repo" = "$repo" ]; then
                duplicate=true
                break
              fi
            done

            if [ "$duplicate" = "false" ]; then
              unique_repos+=("$repo")
            fi
          done

          if [ "${#unique_repos[@]}" -eq 0 ]; then
            echo "No Docker Hub repository names configured"
            exit 1
          fi

          {
            echo "tags<<EOF"
            for repo in "${unique_repos[@]}"; do
              echo "$DOCKER_HUB_URL/$repo:${IMAGE_TAG}"
              if [ "${{ inputs.PRERELEASE }}" = "false" ]; then
                echo "$DOCKER_HUB_URL/$repo:latest"
              fi
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Login to registry
        if: ${{ !inputs.VERIFY_ONLY }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.DOCKER_HUB_URL }}
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ env.DOCKER_HUB_PASSWORD }}
          logout: false

      - if: ${{ inputs.PRERELEASE == true }}
        name: Build image for pre-release
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./
          push: ${{ !inputs.VERIFY_ONLY }}
          tags: ${{ steps.image-tags.outputs.tags }}
          build-args: |
            NEXT_DEPLOYMENT_ID=${{ github.sha }}
            NEXT_PUBLIC_API_SERVICE_URL=${{ env.NEXT_PUBLIC_API_SERVICE_URL }}
            NEXT_PUBLIC_HOST_SERVICE_URL=${{ env.NEXT_PUBLIC_HOST_SERVICE_URL }}
            NEXT_PUBLIC_API_SERVICE_WS_URL=${{ env.NEXT_PUBLIC_API_SERVICE_WS_URL }}
            YANDEX_METRIKA_ID=${{ env.YANDEX_METRIKA_ID }}

      - if: ${{ inputs.PRERELEASE == false }}
        name: Build image for release
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./
          push: ${{ !inputs.VERIFY_ONLY }}
          tags: ${{ steps.image-tags.outputs.tags }}
          build-args: |
            NEXT_DEPLOYMENT_ID=${{ github.sha }}
            NEXT_PUBLIC_API_SERVICE_URL=${{ env.NEXT_PUBLIC_API_SERVICE_URL }}
            NEXT_PUBLIC_HOST_SERVICE_URL=${{ env.NEXT_PUBLIC_HOST_SERVICE_URL }}
            NEXT_PUBLIC_API_SERVICE_WS_URL=${{ env.NEXT_PUBLIC_API_SERVICE_WS_URL }}
            YANDEX_METRIKA_ID=${{ env.YANDEX_METRIKA_ID }}
