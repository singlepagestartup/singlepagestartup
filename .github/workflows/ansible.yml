          SPS_DEPLOY_YANDEX_METRIKA_ID: ${{ secrets.YANDEX_METRIKA_ID }}
        run: bash write_actions_env.sh
      - name: Make script file executable
        run: |
          chmod +x \
            "./$(echo "$BRANCH_NAME" | cut -d'-' -f2).sh"
      - name: Run service script
        env:
          DATABASE_BACKUP_RETENTION_DAYS: ${{ secrets[contains(env.BRANCH_NAME, '-preview') && 'PREVIEW_DATABASE_BACKUP_RETENTION_DAYS' || 'DATABASE_BACKUP_RETENTION_DAYS'] }}
          MCP_CLIENT_CONFIG_OUTPUT_DIR: ${{ runner.temp }}/mcp-client-configs
          SCRIPT_FILE_NAME: ${{ steps.set-script-file-name.outputs.SCRIPT_FILE_NAME }}
        run: |
          "./${SCRIPT_FILE_NAME}.sh"
      - name: Upload generated MCP client configs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mcp-client-configs
          path: ${{ runner.temp }}/mcp-client-configs
          include-hidden-files: true
          if-no-files-found: ignore
