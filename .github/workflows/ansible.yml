name: Ansible

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      BRANCH:
        required: true
        type: string

permissions:
  contents: read

jobs:
  ansible:
    timeout-minutes: 60
    name: ansible run script
    runs-on: ubuntu-latest
    env:
      BRANCH_NAME: ${{ inputs.BRANCH || github.ref_name }}
    defaults:
      run:
        working-directory: ./tools/deployer
    steps:
      - name: Check out repository code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up MCP config generator Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.6"
      - name: Set script file name
        id: set-script-file-name
        run: echo "SCRIPT_FILE_NAME=$(echo "$BRANCH_NAME" | cut -d'-' -f2)" >> "$GITHUB_OUTPUT"
      - name: Set script args
        id: set-script-args
        run: echo "ARGS=$(echo "$BRANCH_NAME" | cut -d'-' -f3- | tr '-' ' ')" >> "$GITHUB_OUTPUT"
      - name: Script and args
        env:
          SCRIPT_FILE_NAME: ${{ steps.set-script-file-name.outputs.SCRIPT_FILE_NAME }}
          ARGS: ${{ steps.set-script-args.outputs.ARGS }}
        run: |
          echo "SCRIPT: ${SCRIPT_FILE_NAME}.sh"
          echo "ARGS: ${ARGS}"
      - name: Add deployer PREVIEW secrets to env file
        if: contains(env.BRANCH_NAME, '-preview')
        env:
          SPS_DEPLOY_PROJECT_NAME: ${{ secrets.PREVIEW_PROJECT_NAME }}
          SPS_DEPLOY_ANSIBLE_HOST: ${{ secrets.PREVIEW_ANSIBLE_HOST }}
          SPS_DEPLOY_ANSIBLE_PORT: ${{ secrets.PREVIEW_ANSIBLE_PORT }}
          SPS_DEPLOY_ANSIBLE_USER: ${{ secrets.PREVIEW_ANSIBLE_USER }}
          SPS_DEPLOY_ANSIBLE_PRIVATE_KEY_BASE64: ${{ secrets.PREVIEW_ANSIBLE_PRIVATE_KEY_BASE64 }}
          SPS_DEPLOY_ANSIBLE_PASSWORD: ${{ secrets.PREVIEW_ANSIBLE_PASSWORD }}
          SPS_DEPLOY_DOMAIN: ${{ secrets.PREVIEW_DOMAIN }}
          SPS_DEPLOY_CERTBOT_SERVICE_NAME: ${{ secrets.PREVIEW_CERTBOT_SERVICE_NAME }}
          SPS_DEPLOY_CERTBOT_EMAIL: ${{ secrets.PREVIEW_CERTBOT_EMAIL }}
          SPS_DEPLOY_USE_CLOUDFLARE_SSL: ${{ secrets.PREVIEW_USE_CLOUDFLARE_SSL }}
          SPS_DEPLOY_ROOT_CLOUDFLARE_ACCOUNT_EMAIL: ${{ secrets.PREVIEW_ROOT_CLOUDFLARE_ACCOUNT_EMAIL }}
          SPS_DEPLOY_ROOT_CLOUDFLARE_ACCOUNT_API_KEY: ${{ secrets.PREVIEW_ROOT_CLOUDFLARE_ACCOUNT_API_KEY }}
          SPS_DEPLOY_ROOT_AWS_ACCESS_KEY_ID: ${{ secrets.PREVIEW_ROOT_AWS_ACCESS_KEY_ID }}
          SPS_DEPLOY_ROOT_AWS_SECRET_ACCESS_KEY: ${{ secrets.PREVIEW_ROOT_AWS_SECRET_ACCESS_KEY }}
          SPS_DEPLOY_AWS_S3_BUCKET_NAME: ${{ secrets.PREVIEW_AWS_S3_BUCKET_NAME }}
          SPS_DEPLOY_AWS_REGION: ${{ secrets.PREVIEW_AWS_REGION }}
          SPS_DEPLOY_AWS_SES_FROM_EMAIL: ${{ secrets.PREVIEW_AWS_SES_FROM_EMAIL }}
