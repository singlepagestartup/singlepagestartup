name: Prepare Docker images

on:
  workflow_dispatch:
    inputs:
      TAG:
        description: Docker image tag to pull
        required: true
        type: string
      PRERELEASE:
        description: Use preview deployment settings
        required: true
        type: boolean
  workflow_call:
    inputs:
      TAG:
        required: true
        type: string
      PRERELEASE:
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  prepare-docker-images:
    name: Pull images on deployment server
    runs-on: ubuntu-latest
    concurrency:
      group: prepare-docker-images-${{ inputs.PRERELEASE && 'preview' || 'production' }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set preview deployment configuration
        if: ${{ inputs.PRERELEASE == true }}
        env:
          DOMAIN: ${{ vars.PREVIEW_DOMAIN }}
          PORTAINER_SERVICE_SUBDOMAIN: ${{ vars.PREVIEW_PORTAINER_SERVICE_SUBDOMAIN }}
          PORTAINER_USERNAME: ${{ vars.PREVIEW_PORTAINER_USERNAME }}
          PORTAINER_PASSWORD: ${{ secrets.PREVIEW_PORTAINER_PASSWORD }}
          DOCKER_HUB_URL: ${{ vars.PREVIEW_DOCKER_HUB_URL }}
          DOCKER_HUB_USERNAME: ${{ vars.PREVIEW_DOCKER_HUB_USERNAME }}
          DOCKER_HUB_LOGIN_USERNAME: ${{ vars.PREVIEW_DOCKER_HUB_LOGIN_USERNAME }}
          HOST_REPOSITORY: ${{ vars.PREVIEW_HOST_SERVICE_DOCKER_HUB_REPOSITORY_NAME }}
          API_REPOSITORY: ${{ vars.PREVIEW_API_SERVICE_DOCKER_HUB_REPOSITORY_NAME }}
          LLM_REPOSITORY: ${{ vars.PREVIEW_LLM_SERVICE_DOCKER_HUB_REPOSITORY_NAME }}
          MCP_REPOSITORY: ${{ vars.PREVIEW_MCP_SERVICE_DOCKER_HUB_REPOSITORY_NAME }}
          TELEGRAM_REPOSITORY: ${{ vars.PREVIEW_TELEGRAM_SERVICE_DOCKER_HUB_REPOSITORY_NAME }}
        run: |
          settings=(
            "DOMAIN=$DOMAIN"
            "PORTAINER_SERVICE_SUBDOMAIN=$PORTAINER_SERVICE_SUBDOMAIN"
            "PORTAINER_USERNAME=$PORTAINER_USERNAME"
            "PORTAINER_PASSWORD=$PORTAINER_PASSWORD"
            "DOCKER_HUB_URL=$DOCKER_HUB_URL"
            "DOCKER_HUB_USERNAME=$DOCKER_HUB_USERNAME"
            "DOCKER_HUB_LOGIN_USERNAME=$DOCKER_HUB_LOGIN_USERNAME"
            "HOST_REPOSITORY=$HOST_REPOSITORY"
            "API_REPOSITORY=$API_REPOSITORY"
            "LLM_REPOSITORY=$LLM_REPOSITORY"
            "MCP_REPOSITORY=$MCP_REPOSITORY"
            "TELEGRAM_REPOSITORY=$TELEGRAM_REPOSITORY"
          )
          for setting in "${settings[@]}"; do
            if [[ "$setting" == *$'\n'* || "$setting" == *$'\r'* ]]; then
              echo "${setting%%=*} must be a single-line value" >&2
              exit 1
            fi
            printf '%s\n' "$setting" >> "$GITHUB_ENV"
          done

      - name: Set production deployment configuration
        if: ${{ inputs.PRERELEASE == false }}
        env:
          DOMAIN: ${{ vars.DOMAIN }}
          PORTAINER_SERVICE_SUBDOMAIN: ${{ vars.PORTAINER_SERVICE_SUBDOMAIN }}
          PORTAINER_USERNAME: ${{ vars.PORTAINER_USERNAME }}
          PORTAINER_PASSWORD: ${{ secrets.PORTAINER_PASSWORD }}
          DOCKER_HUB_URL: ${{ vars.DOCKER_HUB_URL }}
          DOCKER_HUB_USERNAME: ${{ vars.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_LOGIN_USERNAME: ${{ vars.DOCKER_HUB_LOGIN_USERNAME }}
          HOST_REPOSITORY: ${{ vars.HOST_SERVICE_DOCKER_HUB_REPOSITORY_NAME }}
          API_REPOSITORY: ${{ vars.API_SERVICE_DOCKER_HUB_REPOSITORY_NAME }}
          LLM_REPOSITORY: ${{ vars.LLM_SERVICE_DOCKER_HUB_REPOSITORY_NAME }}
          MCP_REPOSITORY: ${{ vars.MCP_SERVICE_DOCKER_HUB_REPOSITORY_NAME }}
          TELEGRAM_REPOSITORY: ${{ vars.TELEGRAM_SERVICE_DOCKER_HUB_REPOSITORY_NAME }}
        run: |
          settings=(
            "DOMAIN=$DOMAIN"
            "PORTAINER_SERVICE_SUBDOMAIN=$PORTAINER_SERVICE_SUBDOMAIN"
            "PORTAINER_USERNAME=$PORTAINER_USERNAME"
            "PORTAINER_PASSWORD=$PORTAINER_PASSWORD"
            "DOCKER_HUB_URL=$DOCKER_HUB_URL"
            "DOCKER_HUB_USERNAME=$DOCKER_HUB_USERNAME"
            "DOCKER_HUB_LOGIN_USERNAME=$DOCKER_HUB_LOGIN_USERNAME"
            "HOST_REPOSITORY=$HOST_REPOSITORY"
            "API_REPOSITORY=$API_REPOSITORY"
            "LLM_REPOSITORY=$LLM_REPOSITORY"
            "MCP_REPOSITORY=$MCP_REPOSITORY"
            "TELEGRAM_REPOSITORY=$TELEGRAM_REPOSITORY"
          )
          for setting in "${settings[@]}"; do
            if [[ "$setting" == *$'\n'* || "$setting" == *$'\r'* ]]; then
              echo "${setting%%=*} must be a single-line value" >&2
              exit 1
            fi
            printf '%s\n' "$setting" >> "$GITHUB_ENV"
          done

      - name: Pull release images through Portainer
        env:
          IMAGE_TAG: ${{ inputs.TAG }}
        run: bash tools/deployer/docker/pull_image_via_portainer.sh
