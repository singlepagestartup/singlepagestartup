name: Update api

on:
  workflow_dispatch:
    inputs:
      TAG:
        description: Docker image tag
        required: true
        default: latest
        type: string
      PRERELEASE:
        description: Use preview deployment settings
        required: true
        default: false
        type: boolean
  workflow_call:
    inputs:
      TAG:
        required: true
        type: string
      PRERELEASE:
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  trigger-service-update:
    name: Update service
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ inputs.TAG }}
    steps:
      - name: Send webhook for preview service update
        if: ${{ inputs.PRERELEASE == true }}
        env:
          SERVICE_UPDATE_URL: ${{ secrets.PREVIEW_PORTAINER_API_UPDATE_URL }}
        run: curl --fail --silent --show-error --max-time 40 --request POST "${SERVICE_UPDATE_URL}?tag=${IMAGE_TAG}"

      - name: Send webhook for production service update
        if: ${{ inputs.PRERELEASE == false }}
        env:
          SERVICE_UPDATE_URL: ${{ secrets.PORTAINER_API_UPDATE_URL }}
        run: curl --fail --silent --show-error --max-time 40 --request POST "${SERVICE_UPDATE_URL}?tag=${IMAGE_TAG}"
