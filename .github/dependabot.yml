# The npm group applies to version updates. Security updates keep separate PRs.
version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/apps/api"
      - "/apps/host"
      - "/apps/mcp"
      - "/apps/openapi"
      - "/apps/studio"
      - "/apps/studio/runnable/startup/singlepagestartup"
      - "/apps/telegram"
      - "/tools/deployer/github/github-node-api"
      - "/tools/plugins/sps-generator-plugin"
    schedule:
      interval: "daily"
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "bun"
    directory: "/apps/studio/runnable/singlepage/admin-v2"
    schedule:
      interval: "daily"

  - package-ecosystem: "pip"
    directory: "/apps/llm"
    schedule:
      interval: "daily"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"

  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/.devcontainer"
      - "/apps/db"
      - "/apps/llm"
      - "/apps/redis"
      - "/tools/deployer/icp"
    schedule:
      interval: "daily"
