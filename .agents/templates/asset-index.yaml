schema: singlepagestartup.asset-index.v1
assets:
  - id: replace-with-stable-id
    design_role: null
    design_key: null
    path: assets/<layer>/intake/replace-with-file
    source_type: client
    intake_category: interface
    preference_signal: replace-with-observable-liked-or-disliked-quality
    lifecycle: null
    proposal_id: null
    evidence: false
    rights_status: unknown
    purpose: replace-with-purpose
    related_artifacts: []
    allowed_use: []
    prohibited_use: []
    prompt: null
    source_or_tool: replace-with-source
# Каждый существенно использованный публичный референс зарегистрировать с
# source_type: public-reference. В purpose указать наблюдаемое качество, которое
# нужно применить или исключить. rights_status и prohibited_use показывают, что
# предпочтение не даёт прав на копирование, переработку, публикацию, товарный знак,
# изображение или исходный файл.
# Для каждого входа дизайна типа client или public-reference указать intake_category:
# identity, interface, typography, photography, illustration или marketing-creative.
# unclassified — временное состояние для исправления, оно не закрывает проверку дизайна.
# Хранить входы в assets/<layer>/intake/<intake_category>/.
# Если решение отклоняет или заменяет вход, проверить ссылки, затем удалить
# соответствующий файл, запись реестра и устаревшие ссылки. История остаётся в Git.
# В preference_signal записать точное наблюдаемое качество, которое оператору
# понравилось или не понравилось. Категория или файл сами по себе не подтверждают
# предпочтение, предполагаемое агентом.
# Для source_type: generated обязательны lifecycle: proposed или approved.
# proposal_id совпадает с ID текущего визуального предложения, путь находится в
# assets/<layer>/generated/<proposal_id>/. Допустим путь к непустой папке, если весь
# набор имеет общее решение, права и состояние. Такая запись регистрирует все файлы;
# происхождение каждого файла сохраняется рядом в generation-manifest.yaml.
# Отклонённые, отозванные, заменённые и устаревшие результаты удаляются с записями
# реестра; действующий реестр не служит архивом. Проверять согласованность ссылок
# бренда, реестра и всего дерева созданных файлов.
# Для ресурса в общем представлении Дизайна design_role называет семейство рендера
# (например logo, photography или motif), а design_key — постоянное смысловое место.
# React-компоненты не должны выбирать ресурс по полному ID конкретного проекта.
