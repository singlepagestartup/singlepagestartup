schema: singlepagestartup.sales-process.v1
product_id: replace-with-portfolio-id
readiness: blocked # blocked | ready
owner: Name the person accountable for the complete sales process
seller: Name the legal or operating seller, or write unknown
pricing: State the price or calculation rule, or write unknown
capacity: State the current process limit, or write unknown
blockers: []
stages:
  - id: inquiry
    name: Inquiry received
    owner: Name one responsible person
    entry_conditions: []
    required_fields: []
    action: State the action taken at this stage.
    exit_condition: State the observable condition for leaving this stage.
    failure: State rejection, timeout, recovery, or fallback behavior.
    metric: State one count, duration, rate, or value used to manage this stage.
