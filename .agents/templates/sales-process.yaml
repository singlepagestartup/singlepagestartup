schema: singlepagestartup.sales-process.v2
product_id: replace-with-product-id
readiness: blocked # Полнота бизнес-решений, а не готовность реализации или согласование.
owner: unknown
seller: unknown
pricing: Ссылка на строку источников выручки для этого продукта в его экономике.
capacity: Ссылка на общие ресурсы и ограничения данного процесса.
blockers:
  - Для описания сегментов клиентов и их коммерческого пути нужны сведения клиента.
segments: [] # Допустимое неизвестное. Не придумывать факты ради заполнения шаблона.
# Каждый id соответствует customer_segments в metadata описания продукта и разделу сегментов.
# Studio создаёт обзор и отдельную страницу каждого сегмента; файл макета не нужен.
# - id: segment-id
#   name: Название сегмента
#   audience: Кто эти люди, в какой ситуации находятся и какого изменения хотят.
#   roles: Пользователь, покупатель/плательщик, выгодополучатель и принимающий решение.
#   needs: [Потребности и трудности из сведений клиента или указанных источников]
#   motivations: [Почему аудитории нужен этот результат]
#   purchase_trigger: Обстоятельство покупки или начала бесплатного использования.
#   decision_criteria: [Что важно при сравнении альтернатив]
#   value_proposition: Польза предложения для этого сегмента.
#   objections:
#     - concern: Причина сомнения или выбора другого решения.
#       response: Правдивый аргумент, отвечающий на сомнение.
#       evidence: Что показать; отделить будущую демонстрацию от имеющегося доказательства.
#   acquisition:
#     - id: channel-id
#       channel: Конкретный источник знакомства с продуктом.
#       context: Ситуация, вопрос или намерение клиента в этом источнике.
#       message: Подходящее обещание.
#       cta: Следующее действие.
#       destination: Конкретная страница, опыт или передача другому участнику.
#   journey:
#     - id: journey-step-id
#       name: Этап карты пути клиента
#       customer_goal: Какого результата клиент хочет здесь.
#       customer_action: Что он делает.
#       customer_question: Вопрос перед продолжением; не выдуманная цитата клиента.
#       experience: Желаемый опыт; предполагаемые мотивы отметить в данных источника.
#       touchpoint: Где происходит взаимодействие.
#       owner: Ответственный человек или роль.
#       entry_conditions: []
#       required_fields: [] # Нужный контекст, а не обязательные формы.
#       action: Ответ бизнеса и предоставляемая ценность.
#       exit_condition: Предполагаемый переход.
#       failure: Коммерческая альтернатива, отказ, помощь или необязательное продолжение.
#       metric: Подходящий показатель без придуманных целевых значений.
# Разрабатывать каждый сегмент из выбранного направления продукта.
# Сохранять существенный контекст, поддержку и удержание; не делать необязательные
# действия обязательными для всех. Баги, тесты и условия установки сюда не относятся.
# Источники различают факты, предложения и неизвестное; согласование хранится в metadata.
