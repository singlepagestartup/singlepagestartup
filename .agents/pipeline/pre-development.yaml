schema: singlepagestartup.pre-development-pipeline.v1
cursor:
  path: apps/studio/workspace/utils/pre-development/<layer>.yaml
  schema: singlepagestartup.pre-development-state.v2
  stages:
    - 00-business
    - 05-products
    - 10-strategy
    - 20-brand
    - 30-design
    - 40-products
  statuses:
    - not_started
    - in_progress
    - prepared
    - skipped
  artifacts:
    - brief

    - strategy
    - brand
    - design
    - assets
    - products
    - product-semantics
stages:
  - id: 00-business
    title: Client Request
    owners:
      - account-manager
      - business-analyst
    active_artifacts:
      - brief
    checks:
      - id: brief.sections
        check: sections
        artifact: brief
        template: templates/brief.md
      - id: brief.no-change-log
        check: no-change-log
        artifact: brief
      - id: brief.framework-headings
        check: framework-headings
        artifact: brief
      - id: brief.formatted
        check: documents-formatted
        artifact: brief
    manual_review:
      - Initial client facts, intentions and unknowns are attributed. Missing information is visible and does
        not block another section.
  - id: 05-products
    title: Products and research
    owners:
      - business-analyst
      - market-researcher
    active_artifacts:
      - products

      - product-semantics
    checks:
      - id: products.sections
        check: product-sections
        artifact: products
        template: templates/product.md
      - id: sales.schema
        check: sales-v2
        artifact: products
      - id: catalog.structure
        check: catalog-structure
        artifact: products
    manual_review:
      - "Review one product at a time: current offer, competitor findings, measured search demand and
        target-page priorities."
      - Semantic candidates without measurements remain hypotheses. Preserve sources, query settings and
        missing-data reasons.
  - id: 10-strategy
    title: Strategy
    owners:
      - strategist
    active_artifacts:
      - strategy
    checks:
      - id: strategy.sections
        check: sections
        artifact: strategy
        template: templates/strategy.md
      - id: strategy.no-change-log
        check: no-change-log
        artifact: strategy
      - id: strategy.framework-headings
        check: framework-headings
        artifact: strategy
      - id: strategy.formatted
        check: documents-formatted
        artifact: strategy
    manual_review:
      - Strategy presents one coherent target state that fulfills the current Brief, not a roadmap, a task
        list or a first-experiment plan.
      - Audience-growth and sales-product priorities are named, every product has a role, and channels have a
        role, content, destination and contribution.
      - Material unknowns sit beside the affected decision and no operator fact such as budget, capacity or
        channel access is invented.
  - id: 20-brand
    title: Brand
    owners:
      - communication-strategist
      - brand-designer
    active_artifacts:
      - brand
    checks:
      - id: brand.sections
        check: sections
        artifact: brand
        template: templates/brand.md
      - id: brand.no-change-log
        check: no-change-log
        artifact: brand
      - id: brand.framework-headings
        check: framework-headings
        artifact: brand
      - id: brand.formatted
        check: documents-formatted
        artifact: brand
    manual_review:
      - Brand owns meaning, message hierarchy, proof boundary, objections, voice, naming and consistency
        rules; colors, type, imagery and layouts stay in Design.
      - Every consequential claim carries evidence or an explicit non-evidence classification.
  - id: 30-design
    title: Design
    owners:
      - brand-designer
    active_artifacts:
      - design
      - assets
    checks:
      - id: brief.visual-intake-ready
        check: visual-intake-ready
        artifact: brief
      - id: design.sections
        check: design-sections
        artifact: design
        template: templates/design.md
      - id: design.no-change-log
        check: no-change-log
        artifact: design
      - id: design.framework-headings
        check: framework-headings
        artifact: design
      - id: design.formatted
        check: documents-formatted
        artifact: design
      - id: assets.generated-registered
        check: generated-assets-registered
        artifact: assets
      - id: design.media-examples
        check: media-examples
        artifact: design
      - id: design.brandbook-owned
        check: brandbook-owned
        artifact: design
      - id: design.specimens-rendered
        check: specimens-rendered
        artifact: design
      - id: design.specimen-catalogue
        check: specimen-catalogue
        artifact: design
    manual_review:
      - Missing visual preferences stay explicit; available inputs support a proposal without claiming user
        approval.
      - Photography and illustration examples were reviewed together at source size, intended size and small
        preview; a changed master prompt was retested on three briefs.
      - Typography roles name an exact CSS family, weights and a registered font asset, and the loaded font
        was verified in a browser.
      - A dedicated Icons block names the library or custom drawing method, source and license, defines
        geometry and usage, and shows reviewed action, navigation and status glyphs at their intended sizes.
      - Photographic and illustrative masters use free aspect ratios. Square deliveries preserve the full
        source composition through canvas expansion with an image-editing tool, use the common delivery
        resolution, and retain source files and exact editing provenance; already-square masters may be reused
        unchanged.
  - id: 40-products
    title: Pages and content
    owners:
      - business-analyst
      - strategist
      - web-designer
      - brand-designer
      - communication-strategist
    active_artifacts:
      - products
    checks:
      - id: sales.readiness
        check: sales-readiness
        artifact: products
    manual_review:
      - Every catalog entry describes a product established by the current project facts.
      - Materials apply the product offer and sales process. Site, presentation, advertising and article
        packages contain only chosen formats; do not generate placeholders for unused formats.
      - Each article identifies its audience, intent, product action and evidence. Videos, posts and covers
        belong to that article. Missing search measurements are recorded as unknown.
      - Product documents describe the intended business plan and requirements; installation checks, runtime
        tests and release audits are not completion gates.
