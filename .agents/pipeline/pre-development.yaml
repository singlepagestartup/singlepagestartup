# Stage machine of the pre-development workflow.
#
# The structural requirements that .agents/workflows/pre-development.md and its
# contracts describe in prose are declared here as checks and executed by
# `npm run singlepagestartup:pipeline:check`. Judgment criteria stay with the
# owning roles and are listed under manual_review so the report shows them
# beside the executable result. The command reads the workspace and the layer
# cursor; it never writes either. Stage IDs, statuses and artifact names are
# the vocabulary of the existing cursor schema and must not change.
schema: singlepagestartup.pre-development-pipeline.v1
cursor:
  path: apps/studio/workspace/utils/pre-development/<layer>.yaml
  schema: singlepagestartup.pre-development-state.v1
  stages: [00-business, 10-strategy, 20-brand, 30-design, 40-products]
  statuses: [not_started, in_progress, blocked, complete]
  artifacts:
    [
      brief,
      product-models,
      product-research,
      strategy,
      brand,
      design,
      assets,
      products,
    ]
stages:
  - id: 00-business
    title: Client Request
    owners: [account-manager, business-analyst]
    active_artifacts: [brief, product-models]
    checks:
      - id: brief.sections
        check: sections
        artifact: brief
        template: templates/brief.md
      - id: brief.confirmation-metadata
        check: frontmatter
        artifact: brief
        keys: [confirmation]
      - id: brief.scope-confirmed
        check: brief-scope
        artifact: brief
      - id: catalog.matches-brief
        check: catalog-matches-brief
        artifact: products
      - id: models.sections
        check: model-sections
        artifact: products
        template: templates/product-model.md
      - id: products.sections
        check: product-sections
        artifact: products
        template: templates/product.md
      - id: sales.schema
        check: sales-v2
        artifact: products
    manual_review:
      - The confirmed scope names the primary decision subject, its boundaries and every product in scope with an attributable operator confirmation.
      - Client facts, confirmed intentions, supplied-material observations and unknowns are attributed; no operator fact is answered by an assumption.
      - Initial Product, Operations & Economics and Sales intake record only client inputs; missing details are explicit unknowns, not invented values.
  - id: 10-strategy
    title: Strategy
    owners: [market-researcher, strategist]
    active_artifacts: [product-research, strategy]
    checks:
      - id: research.sections
        check: research-sections
        artifact: products
        template: templates/product-research.md
      - id: research.finding-prefix
        check: research-finding-prefix
        artifact: products
      - id: strategy.sections
        check: sections
        artifact: strategy
        template: templates/strategy.md
      - id: strategy.confirmed
        check: confirmed
        artifact: strategy
    manual_review:
      - Strategy presents one coherent target state that fulfills the approved Brief, not a roadmap, a task list or a first-experiment plan.
      - Audience-growth and sales-product priorities are named, every confirmed product has a role, and channels have a role, content, destination and contribution.
      - Material unknowns sit beside the affected decision and no operator fact such as budget, capacity or channel access is invented.
  - id: 20-brand
    title: Brand
    owners: [communication-strategist, brand-designer]
    active_artifacts: [brand]
    checks:
      - id: brand.sections
        check: sections
        artifact: brand
        template: templates/brand.md
      - id: brand.confirmed
        check: confirmed
        artifact: brand
    manual_review:
      - Brand owns meaning, message hierarchy, proof boundary, objections, voice, naming and consistency rules; colors, type, imagery and layouts stay in Design.
      - Every consequential claim carries evidence or an explicit non-evidence classification.
  - id: 30-design
    title: Design
    owners: [brand-designer]
    active_artifacts: [design, assets]
    checks:
      - id: brief.visual-intake-ready
        check: visual-intake-ready
        artifact: brief
      - id: design.sections
        check: design-sections
        artifact: design
        template: templates/design.md
      - id: design.confirmed
        check: confirmed
        artifact: design
      - id: assets.generated-registered
        check: generated-assets-registered
        artifact: assets
      - id: design.media-examples
        check: media-examples
        artifact: design
      - id: design.brandbook-owned
        check: brandbook-owned
        artifact: design
      - id: design.specimens-rendered
        check: specimens-rendered
        artifact: design
    manual_review:
      - The Client visual preference profile was confirmed by the operator before any visual territory, token, prompt or generated asset was selected.
      - Photography and illustration examples were reviewed together at source size, intended size and small preview; a changed master prompt was retested on three briefs.
      - Typography roles name an exact CSS family, weights and a registered font asset, and the loaded font was verified in a browser.
  - id: 40-products
    title: Products
    owners:
      [
        business-analyst,
        strategist,
        web-designer,
        brand-designer,
        communication-strategist,
      ]
    active_artifacts: [products]
    checks:
      - id: catalog.structure
        check: catalog-structure
        artifact: products
      - id: analytics.declared
        check: analytics-declared
        artifact: products
        template: templates/product-analytics.md
      - id: sales.readiness
        check: sales-readiness
        artifact: products
    manual_review:
      - Every catalog entry traces to a confirmed Brief product; no product was inferred from a showcase, a repository folder or an idea.
      - Website, Marketing Creative and Presentation exist for every product where they are in scope, and an explicit not-applicable decision replaces any placeholder.
      - Product documents describe the intended business plan and requirements; installation checks, runtime tests and release audits are not completion gates.
legacy_shapes:
  - id: decision-profile
    detect: decision-profile
    procedure: contracts/pipeline-reconciliation.md#retiring-the-former-decision-profile
  - id: standalone-business
    detect: standalone-business
    procedure: contracts/pipeline-reconciliation.md#retiring-standalone-business
  - id: catalog-v1
    detect: catalog-v1
    procedure: contracts/pipeline-reconciliation.md#retiring-standalone-business
  - id: sales-v1
    detect: sales-v1
    procedure: contracts/pipeline-reconciliation.md#sales-segment-compatibility
  - id: evidence-register-codes
    detect: evidence-register-codes
    procedure: contracts/pipeline-reconciliation.md#layer-and-inheritance-rules
  - id: legacy-cursor-anchors
    detect: legacy-cursor-anchors
    procedure: contracts/pipeline-reconciliation.md#compact-strategy-migration
