schema: singlepagestartup.github-reconciliation.v1
remote: origin
branch: default
strategy_path: apps/studio/workspace/strategy/startup.md
ignore_paths:
  - apps/studio/workspace/pre-development/github/**
  - apps/studio/workspace/**
  - .agents/**
  - .claude/**
  - .codex/**
  - thoughts/**
rules:
  - id: license-and-distribution
    paths:
      - LICENSE
      - LICENSE.*
      - COPYING*
      - NOTICE*
      - README.md
      - package.json
      - package-lock.json
    affected_artifacts:
      - startup.evidence
      - startup.research
      - startup.strategy
      - startup.brand
      - startup.products
    earliest_stage: 00-business
  - id: product-capabilities
    paths:
      - apps/**
      - libs/**
    affected_artifacts:
      - startup.evidence
      - startup.business
      - startup.research
      - startup.strategy
      - startup.brand
      - startup.products
    earliest_stage: 00-business
  - id: setup-release-and-runtime
    paths:
      - ai.sh
      - up.sh
      - .nvmrc
      - docker-compose*.yaml
      - docker-compose*.yml
    affected_artifacts:
      - startup.evidence
      - startup.business
      - startup.research
      - startup.strategy
      - startup.brand
      - startup.products
    earliest_stage: 00-business
reconciliations: []
