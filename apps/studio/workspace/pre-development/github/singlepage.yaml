      - singlepage.evidence
      - singlepage.business
      - singlepage.research
      - singlepage.strategy
      - singlepage.brand
      - singlepage.products
    earliest_stage: 00-business
  - id: setup-release-and-runtime
    paths:
      - ai.sh
      - up.sh
      - .nvmrc
      - docker-compose*.yaml
      - docker-compose*.yml
      - apps/db/**
      - apps/redis/**
    affected_artifacts:
      - singlepage.evidence
      - singlepage.business
      - singlepage.research
      - singlepage.strategy
      - singlepage.brand
      - singlepage.products
    earliest_stage: 00-business
reconciliations: []
