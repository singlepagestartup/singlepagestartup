schema: singlepagestartup.github-reconciliation.v1
remote: origin
branch: default
strategy_path: apps/studio/workspace/strategy/singlepage.md
ignore_paths:
  - apps/studio/workspace/pre-development/github/**
rules:
  - id: license-and-distribution
    paths:
      - LICENSE
      - LICENSE.*
      - COPYING*
      - NOTICE*
      - README.md
      - package.json
      - package-lock.json
