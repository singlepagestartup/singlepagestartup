schema: singlepagestartup.workspace-index.v1
layer: singlepage
entries:
  - id: singlepage.brief
    kind: brief
    path: brief/singlepage.md
    description:
      Current project, products, customers, value, business resources, goals and client
      visual preferences.
    uses: []
  - id: singlepage.strategy
    kind: strategy
    path: strategy/singlepage.md
    description: Marketing goals, positioning, product roles, channels, customer journeys, and growth.
    uses:
      - singlepage.brief
  - id: singlepage.asset-index
    kind: asset-index
    path: assets/singlepage.yaml
    description: Provenance, rights, purpose, and usage limits for assets.
    uses: []
  - id: singlepage.brand
    kind: brand
    path: brand/singlepage.md
    description: Brand meaning, message hierarchy, voice, naming, and governance.
    uses:
      - singlepage.strategy
  - id: singlepage.design
    kind: design
    path: design/singlepage.md
    description: Visual identity, reusable design rules, imagery, and approved outputs.
    uses:
      - singlepage.brief
      - singlepage.brand
      - singlepage.asset-index
  - id: singlepage.products
    kind: products
    path: products/singlepage/catalog.yaml
    description:
      Catalog of visible product descriptions, audiences, competitors, semantics,
      economics, sales and marketing materials.
    uses:
      - singlepage.brief
  - id: template.brief
    kind: template
    path: .agents/templates/brief.md
    description: Compact client brief structure.
    uses: []
  - id: template.sales-process
    kind: template
    path: .agents/templates/sales-process.yaml
    description: Machine-readable sales-process structure for one active product.
    uses: []
  - id: template.strategy
    kind: template
    path: .agents/templates/strategy.md
    description: Project-wide marketing strategy structure.
    uses: []
  - id: template.asset-index
    kind: template
    path: .agents/templates/asset-index.yaml
    description: Provenance-aware asset index structure.
    uses: []
  - id: template.brand
    kind: template
    path: .agents/templates/brand.md
    description: Communication and identity structure.
    uses: []
  - id: template.design
    kind: template
    path: .agents/templates/design.md
    description: Reusable visual-system structure.
    uses: []
  - id: template.product
    kind: template
    path: .agents/templates/product.md
    description: Product-specific offer and delivery structure.
    uses: []
  - id: template.products
    kind: template
    path: .agents/templates/products.yaml
    description: Atomic product-catalog structure.
    uses: []
  - id: template.website
    kind: template
    path: .agents/templates/website.md
    description: Concrete website and conversion-flow structure.
    uses: []
  - id: template.creative
    kind: template
    path: .agents/templates/creative.md
    description: Selected-channel marketing creative structure.
    uses: []
  - id: template.product-semantics
    kind: template
    path: .agents/templates/product-semantics.md
    description: Product-owned search evidence, query groups and target pages.
    uses: []
  - id: template.product-research-competitors
    kind: template
    path: .agents/templates/product-research-competitors.md
    description: Website and offer comparison for one product.
    uses: []
  - id: template.product-audience
    kind: template
    path: .agents/templates/product-audience.md
    description: Audience situations, needs, objections and communication conclusions.
    uses: []
  - id: template.product-economics
    kind: template
    path: .agents/templates/product-economics.md
    description: Revenue, operations, resources, partners and costs of one product.
    uses: []
exports:
  - template.brief
  - template.sales-process
  - template.strategy
  - template.asset-index
  - template.brand
  - template.design
  - template.product
  - template.products
  - template.website
  - template.creative
  - template.product-semantics
  - template.product-research-competitors
  - template.product-audience
  - template.product-economics
imports: []
