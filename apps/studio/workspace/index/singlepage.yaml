schema: singlepagestartup.workspace-index.v1
layer: singlepage
entries:
  - {
      id: singlepage.brief,
      kind: brief,
      path: brief/singlepage.md,
      description: "Source request, founder language, constraints, goals, and unknowns.",
      uses: [singlepage.discovery, singlepage.asset-index],
    }
  - {
      id: singlepage.evidence,
      kind: evidence,
      path: evidence/singlepage.md,
      description: "Evidence, claims, assumptions, constraints, and missing proof.",
      uses: [],
    }
  - {
      id: singlepage.decision-profile,
      kind: decision-profile,
      path: knowledge/decision-profile/singlepage.md,
      description: "Project-specific business-model classification and material domain quality gates.",
      uses: [singlepage.brief, singlepage.evidence],
    }
  - {
      id: singlepage.business,
      kind: business,
      path: business/singlepage.md,
      description: "Business model, economics, capacity, and complete operating process.",
      uses:
        [singlepage.brief, singlepage.evidence, singlepage.decision-profile],
    }
  - {
      id: singlepage.portfolio,
      kind: portfolio,
      path: portfolio/singlepage.yaml,
      description: "Complete direction inventory with one research document per direction and one sales process per active product.",
      uses:
        [singlepage.brief, singlepage.evidence, singlepage.decision-profile],
    }
  - {
      id: singlepage.research,
      kind: research,
      path: research/singlepage.md,
      description: "Audiences, market, competitors, alternatives, sources, and inferences.",
      uses:
        [
          singlepage.brief,
          singlepage.evidence,
          singlepage.decision-profile,
          singlepage.portfolio,
        ],
    }
  - {
      id: singlepage.strategy,
      kind: strategy,
      path: strategy/singlepage.md,
      description: "Positioning, offer, commercial focus, and first experiment.",
      uses:
        [
          singlepage.business,
          singlepage.portfolio,
          singlepage.research,
          singlepage.evidence,
          singlepage.acquisition,
        ],
    }
  - {
      id: singlepage.asset-index,
      kind: asset-index,
      path: assets/singlepage.yaml,
      description: "Provenance, rights, purpose, and usage limits for assets.",
      uses: [singlepage.evidence],
    }
  - {
      id: singlepage.brand,
      kind: brand,
      path: brand/singlepage.md,
      description: "Brand meaning, message hierarchy, voice, naming, and governance.",
      uses:
        [
          singlepage.strategy,
          singlepage.research,
          singlepage.evidence,
          singlepage.communication,
        ],
    }
  - {
      id: singlepage.design,
      kind: design,
      path: design/singlepage.md,
      description: "Visual identity, reusable design rules, imagery, and approved outputs.",
      uses:
        [singlepage.brief, singlepage.brand, singlepage.evidence, singlepage.asset-index],
    }
  - {
      id: singlepage.products,
      kind: products,
      path: products/singlepage.yaml,
      description: "Atomic catalog of products and their Product, Website, Marketing Creative, and Presentation sources.",
      uses:
        [
          singlepage.business,
          singlepage.portfolio,
          singlepage.strategy,
          singlepage.brand,
          singlepage.design,
          singlepage.evidence,
          singlepage.asset-index,
          singlepage.acquisition,
          singlepage.communication,
        ],
    }
  - {
      id: profession.role-contract-evaluation,
      kind: knowledge,
      path: legacy/role-contract-evaluation.md,
      description: Compact-role comparison cases and retained-method rationale.,
      uses: [],
    }
  - {
      id: singlepage.discovery,
      kind: discovery,
      path: knowledge/discovery/singlepage.md,
      description: Singlepage-specific discovery questions,
      findings,
      and intake decisions.,
      uses: [],
    }
  - {
      id: singlepage.acquisition,
      kind: acquisition,
      path: knowledge/acquisition/singlepage.md,
      description: Singlepage-specific channel research and acquisition decisions.,
      uses: [],
    }
  - {
      id: singlepage.communication,
      kind: communication,
      path: knowledge/communication/singlepage.md,
      description: Singlepage-specific communication research and content decisions.,
      uses: [],
    }
  - {
      id: knowledge.legacy-agency-migration,
      kind: migration,
      path: legacy/legacy-agency.md,
      description: Canonical destination and omission map for retired agency files.,
      uses: [],
    }
  - {
      id: template.brief,
      kind: template,
      path: .agents/templates/brief.md,
      description: Compact client brief structure.,
      uses: [],
    }
  - {
      id: template.evidence,
