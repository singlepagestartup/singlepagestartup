  - id: ai-chat
    name: AI Chat
    summary: Соберите описание проекта из заметок, документов и изображений. Отредактируйте его вместе с агентом,
      скачайте документы или прикрепите их к следующему разговору.
    audience: ai-chat/audience.md
    competitors: ai-chat/competitors.md
    semantics: ai-chat/semantics.md
    economics: ai-chat/economics.md
    sales: ai-chat/sales.yaml
    product: ai-chat/product.md
    website: ai-chat/website.md
    marketing_creative: ai-chat/marketing-creative.md
    presentation: ai-chat/presentation/ProjectPresentation.tsx
    sections:
      - id: presentation
        title: Презентация
        pages:
          - id: brief
            title: Задача презентации
            source: ai-chat/presentation/brief.md
      - id: website
        title: Сайт
        pages:
          - id: pages
            title: Страницы
            children:
              - id: landing
                title: Страница продукта
                route: /ai-chat/
                source: ai-chat/website/Landing.tsx
              - id: register
                title: Создать аккаунт
                route: /ai-chat/rbac/subjects/authentication/registration
                source: ai-chat/website/Register.tsx
              - id: login
                title: Войти
                route: /ai-chat/rbac/subjects/authentication/select-method
                source: ai-chat/website/Login.tsx
              - id: project-workspace
                title: Чат проекта
                route: /ai-chat/social/profiles/[social.profiles.id]
                uses:
                  - product.ai-chat.page.content.one-hour-setup
                  - product.ai-chat.page.content.project-model
                source: ai-chat/website/ProjectWorkspace/Screen.tsx
              - id: tokens
                title: Купить токены
                route: /ai-chat/rbac/subjects/tokens
                source: ai-chat/website/Tokens.tsx
              - id: settings
                title: Настройки
                route: /ai-chat/rbac/subjects/settings
                source: ai-chat/website/Settings.tsx
              - id: help
                title: Помощь
                route: /ai-chat/help
                source: ai-chat/website/Help.tsx
      - id: content
        title: Материалы продукта
        pages:
          - id: one-hour-setup
            title: Настройка за час
            source: ai-chat/content/GuidedCards.tsx
          - id: project-model
            title: Модель проекта
            source: ai-chat/content/WorkspaceMap.tsx
      - id: creative
        title: Рекламные материалы
        pages:
          - id: ads
            title: Рекламные макеты
            source: ai-chat/marketing-creative/Ads.tsx
      - id: articles
        title: Статьи
        pages:
          - id: project-description
            title: "Как написать описание услуги для сайта: пример и шаблон"
            source: ai-chat/articles/project-description/brief.md
            children:
              - id: project-description-seo
                title: SEO и поисковое задание
                source: ai-chat/articles/project-description/seo.md
              - id: project-description-text
                title: Статья
                source: ai-chat/marketing-creative/Article.tsx
              - id: project-description-horizontal
                title: Горизонтальное видео
                source: ai-chat/articles/project-description/horizontal-video.md
              - id: project-description-vertical
                title: Вертикальное видео
                source: ai-chat/articles/project-description/vertical-video.md
              - id: project-description-social
                title: Публикация в соцсетях
                source: ai-chat/marketing-creative/SocialPost.tsx
              - id: project-description-publication
                title: Публикация и результаты
                source: ai-chat/articles/project-description/publication.md
