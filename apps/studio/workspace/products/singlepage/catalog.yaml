  - id: ai-chat
    model: framework-service
    name: AI Chat
    summary: Upload notes, documents, screenshots and images, review a compact
      five-stage project model in about one focused session, then keep working
      with a chat that uses the same project. Build and preview a landing page
      in the sandbox, publish it through a GitHub repository and the user's
      server, buy tokens for more hosted work or use Code Framework for another
      digital product.
    research: ai-chat/research.md
    analytics: ai-chat/analytics.md
    sales: ai-chat/sales.yaml
