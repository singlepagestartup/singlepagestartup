  - id: ai-chat
    name: AI Chat
    summary: Опишите проект или загрузите заметки, документы и изображения.
      Подготовьте с ИИ-помощником бриф, стратегию, бренд, дизайн и отдельные
      описания продуктов. Уточняйте сведения, редактируйте документы,
      скачивайте их и используйте сохранённые знания в новых обсуждениях.
      Создание посадочных страниц и платный запуск на сервере относятся
      к будущим возможностям.
    research: ai-chat/research.md
    analytics: ai-chat/analytics.md
