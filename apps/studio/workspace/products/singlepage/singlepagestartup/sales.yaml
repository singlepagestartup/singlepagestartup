schema: singlepagestartup.sales-process.v2
product_id: singlepagestartup
readiness: ready
owner: Владелец проекта
seller: Бесплатный фреймворк помогает предпринимателям запускать цифровые продукты. Планируемый источник
  выручки — партнёрские выплаты от хостинг-провайдеров за привлечённых клиентов.
pricing: Исходный код — бесплатно по MIT. ИИ, сервер, домен и внешние сервисы оплачиваются отдельно.
  Партнёрские тарифы и процент выплат будут определяться соглашениями с провайдерами.
capacity: Помощь и рассмотрение предложений зависят от свободного времени владельца. График поддержки не гарантирован.
blockers: []
segments:
  - id: makers
    name: Предприниматели и создатели цифровых продуктов
    audience: Предприниматели с услугой или товаром, которым нужен собственный сайт, и создатели цифровых
      продуктов, работающие с ИИ-агентом. Первое знакомство проходит через пример и работу с описанием своего
      бизнеса в AI Chat.
    roles: Создатель или команда — пользователь, выгодополучатель и принимающий решение. Покупателя кода нет;
      человек отдельно оплачивает выбранных агентов и инфраструктуру.
    needs:
      - Превратить текущую идею в полезный продукт, повторно используя подходящие функции. Регистрация,
        корзина и платежи нужны там, где этого требует бизнес.
      - Понять, что даёт основа, что для этой идеи избыточно и чего ещё не хватает продукту.
      - Направлять работу обычным языком и оценивать результат для клиента и бизнеса вместе с интерфейсом.
      - Продолжать после первого результата с понятными объяснениями, пригодными для повторного использования
        инструкциями и ясными условиями помощи.
    motivations:
      - Тратить время и токены ИИ на свои правила бизнеса, используя подходящие готовые функции.
      - Перейти от текущей идеи или понятного примера к своему продукту с ясным следующим действием.
      - Сохранять контроль решений и понимать прогресс достаточно, чтобы направлять работу. Глубокое изучение
        технологий необязательно.
      - Сохранить основу для подходящих будущих идей без покупки кода.
    decision_criteria:
      - Нужные функции и ожидаемый результат для клиента соответствуют основе; избыточный объём и оставшаяся
        работа понятны.
      - Инструкции помогают получить первый результат и продолжать изменения. Создателю понятны его
        обязанности и пределы помощи.
      - Бесплатный код, использование агента, эксплуатация, внешние сервисы и необязательные покупки в чате
        разделены. Понятно, как интенсивность использования и выбор сервисов влияют на расходы.
      - Польза доработки и повторного использования оправдывает ответственность за собственный проект по
        сравнению с удобством готового конструктора или сервиса.
    purchase_trigger: Нужно представить продукт в интернете, наладить приём обращений или реализовать своё правило
      работы с клиентами. Первый шаг — попробовать описать задачу в AI Chat и оценить результат на своих
      материалах.
    value_proposition: Сформулируйте задачу своего бизнеса в AI Chat, затем используйте готовые страницы, каталог,
      заявки, аккаунты и оплату Code Framework для разработки цифрового продукта.
    objections:
      - concern: Я недостаточно знаю код, чтобы это создать и оценить следующее изменение.
        response: Показать бизнес-сценарий, ожидаемый результат и понятное объяснение изменения. Дать инструкции для
          продолжения и объяснить, что личная помощь доступна по возможности.
        evidence: "Разбор правила заказа: запрос создателя, путь клиента, бизнес-результат и инструкция для следующего
          изменения."
      - concern: Бесплатный код может скрывать неожиданные расходы.
        response: Отделить нулевую цену кода от агента, эксплуатации, внешних сервисов и необязательных покупок в
          чате. Объяснить влияние использования и выбора сервисов на расходы.
        evidence: Объяснение разовых, постоянных и зависящих от использования расходов, а также необязательных покупок
          AI Chat; без обещания фиксированной полной цены.
      - concern: Мой агент или другой стартовый проект может сделать то же самое.
        response: Выбирать SPS, когда его функции и дальнейшие инструкции подходят идее. Сравнить повторно
          используемое, лишнее и недостающее. Другая основа, генерация под задачу или существующий проект
          могут подойти лучше.
        evidence: Сравнение SPS, другой основы и текущего подхода для конкретной задачи, включая оставшуюся работу и
          инструкции.
      - concern: Зачем уходить из готового конструктора, который меня устраивает?
        response: Сопоставить пользу общей основы и доработок с удобством и поддержкой, от которых придётся
          отказаться. Готовый сервис может оставаться лучшим выбором; экспорт кода сам по себе не делает SPS
          необходимым.
        evidence: "Сравнение для задачи создателя: нужный результат, обязанности, расходы, помощь и контроль."
    acquisition:
      - id: website
        channel: Сайт, презентация и реклама
        context: Предприниматель знакомится с фреймворком и хочет понять, что получится для его бизнеса.
        message: Начните с описания своей задачи. Готовые модули станут основой разработки.
        cta: Создать продукт
        destination: /ai-chat/rbac/subjects/authentication/registration
      - id: hosted-chat
        channel: AI Chat
        context: После полезного опыта в чате человек с идеей своего продукта может заинтересоваться его основой.
        message: Создайте свой продукт на основе этого чата.
        cta: Запустить проект на своём компьютере
        destination: GitHub и разговор с агентом-разработчиком, если собственный проект подходит задаче. Можно
          продолжить работу в готовом чате.
      - id: video
        channel: Демонстрации YouTube и связанные Shorts
        context: Узнаваемая бизнес-задача и её доработка показывают пользу зрителю с собственной идеей.
        message: Посмотрите результат для бизнеса и оцените, подходит ли основа вашей идее.
        cta: Изучить фреймворк
        destination: Страница Code Framework с примером и переходом в AI Chat. Подготовленный разработчик может
          открыть GitHub по вторичной ссылке.
      - id: search-community
        channel: Руководства для поиска и ответы в подходящих сообществах
        context: Создатель ищет способ реализовать конкретную бизнес-функцию.
        message: Используйте общие функции и добавьте правила своего бизнеса.
        cta: Посмотреть пример
        destination: Статья с ответом на задачу → страница Code Framework → проба в AI Chat на своих материалах.
      - id: repository
        channel: Прямой доступ к коду
        context: Человек или его разработчик уже выбрал собственную разработку и хочет изучить реализацию.
        message: Изучите модули и инструкции для своего проекта.
        cta: Посмотреть на GitHub
        destination: https://github.com/singlepagestartup/singlepagestartup
    journey:
      - id: reached-explanation
        name: Узнать способ решения своей задачи
        customer_goal: Понять, как представить продукт и начать его разработку.
        customer_action: Прочитать статью, посмотреть презентацию или страницу Code Framework; открыть AI Chat.
        customer_question: Что получится для моего продукта и с чего начать?
        experience: Понятны пример результата, первый шаг и возможность посмотреть код отдельно.
        touchpoint: Статья, рекламный макет, презентация, посадочная Code Framework.
        owner: Владелец проекта показывает пример; посетитель выбирает следующий шаг.
        entry_conditions:
          - Подходящий вопрос или идея приводит посетителя к примеру.
        required_fields:
          - Для знакомства персональные данные не нужны.
        action: Показать результат для предпринимателя, связанные модули и пример доработки. Основная кнопка —
          «Создать продукт»; вторичная — «GitHub».
        exit_condition: Человек открывает AI Chat, чтобы описать свою задачу, либо выбирает прямой путь к коду.
        failure: "Нет подходящей задачи или интереса: уйти либо вернуться позже к другому примеру."
        metric: Переходы в AI Chat и переходы в GitHub учитываются отдельно.
      - id: recorded-decision
        name: Проверить подход на своём бизнесе
        customer_goal: Получить связное описание задачи и понять, какие функции нужны цифровому продукту.
        customer_action: Передать сведения о продукте в AI Chat, уточнить описание, аудиторию и пользовательские
          действия; оценить подготовленный документ.
        customer_question: Ассистент понял мой бизнес? Можно ли по этому описанию готовить контент и разработку?
        experience: Условия бизнеса видны в документе, их можно исправить. Результат можно использовать для статьи,
          рекламы или технического задания.
        touchpoint: "AI Chat: материалы проекта, документ и диалог."
        owner: Создатель или команда решает; владелец проекта даёт объяснение.
        entry_conditions:
          - У посетителя есть идея продукта и желание оценить соответствие.
        required_fields:
          - Желаемый продукт, результат клиента и важные бизнес-функции.
          - Текущий подход, нужный контроль, допустимые расходы и ожидания помощи.
        action: "Собрать базу знаний проекта, показать конкретный документ и предложить подходящий следующий шаг:
          контент или разработку на Code Framework."
        exit_condition: Человек сохраняет результат и выбирает следующую задачу; для разработки переходит к Code Framework.
        failure: "Польза не оправдывает работу или ответственность: остаться в готовом сервисе, использовать
          существующее решение либо отложить."
        metric: Созданные проекты и сохранённые результаты после перехода с материалов фреймворка.
      - id: evaluation-started
        name: Начать собственный проект
        customer_goal: Перейти от примера к продукту, который можно менять.
        customer_action: Использовать сформированное техническое задание, открыть GitHub и попросить агента
          подготовить проект на нужных модулях.
        customer_question: Какой следующий шаг и как после него продолжать доработку?
        experience: "Желаемый опыт: посильное следующее действие и контроль направления проекта."
        touchpoint: Инструкции репозитория и Claude Code или Codex Desktop.
        owner: Создатель направляет агента; владелец проекта предоставляет код и инструкции.
        entry_conditions:
          - Создатель выбирает SPS для своего продукта.
        required_fields:
          - Идея проекта и выбранный агент-разработчик.
        action: Предоставить основу и понятный переход к собственному проекту, инструкции для дальнейших изменений и
          условия помощи по возможности.
        exit_condition: Создатель начинает продукт на SPS.
        failure: "Нужно больше инструкций или меньше ответственности: прочитать руководство, обратиться за
          необязательной помощью, остаться в сервисе или отложить."
        metric: Проекты, начатые после чата, демонстраций и прямого знакомства с репозиторием.
      - id: capability-checked
        name: Адаптировать продукт к бизнесу
        customer_goal: Получить результат для собственной бизнес-задачи.
        customer_action: Описать агенту правила, изучить интерфейс и оценить, даёт ли действие клиента нужный
          бизнес-результат.
        customer_question: Выполняет ли это задачу моего клиента или бизнеса?
        experience: "Желаемый опыт: понятный прогресс к полезному результату и возможность уточнять идею."
        touchpoint: Разговор с агентом, интерфейс и предполагаемая задача клиента.
        owner: Создатель определяет ценность; агент помогает создавать продукт.
        entry_conditions:
          - Создатель разрабатывает продукт на общей основе.
        required_fields:
          - Нужное поведение бизнеса и полезный результат.
        action: Связать общие функции и правила продукта с результатом клиента; объяснить выбор и продолжение.
        exit_condition: Создатель может объяснить пользу доработки либо уточняет направление.
        failure: "Идея требует уточнения: изменить бриф, запросить помощь или выбрать другой подход."
        metric: Сообщённые создателями полезные результаты, доработки и общие функции, использованные в продуктах.
      - id: adoption-decided
        name: Продолжать и использовать снова
        customer_goal: Опираясь на удачный опыт, не начинать каждую идею с нуля.
        customer_action: Развивать продукт, снова выбрать SPS или порекомендовать пример.
        customer_question: Подойдёт ли эта основа следующему продукту?
        experience: "Желаемый опыт: знакомая среда и дальнейшая польза с возможностью изменить выбор при новых
          потребностях."
        touchpoint: Существующий проект, повторно используемые инструкции и новый бриф.
        owner: Создатель или команда.
        entry_conditions:
          - Полезный опыт создаёт продолжающуюся или новую потребность.
        required_fields:
          - Текущая потребность продукта или следующая идея.
        action: Сохранять инструкции пригодными для разных проектов, делиться подходящими примерами и улучшениями.
        exit_condition: Продолжение работы, другой проект, рекомендация или уход.
        failure: Потребность закончилась либо другой подход подходит лучше; уход остаётся допустимым выбором.
        metric: Продолжение использования, применение в следующем продукте и рекомендации.
      - id: support-and-community
        name: Получить помощь или поделиться улучшением
        customer_goal: Получить направление или помочь другим воспользоваться опытом.
        customer_action: Задать вопрос, показать пример или предложить вклад, когда это полезно.
        customer_question: Куда обратиться или что-то предложить и какого ответа ждать?
        experience: "Желаемый опыт: понятный способ обращения и реалистичные ожидания помощи."
        touchpoint: Инструкции до выбора и во время использования, обращения в репозитории и добровольный вклад.
        owner: Создатель предоставляет контекст; владелец рассматривает его по возможности.
        entry_conditions:
          - Необязательный переход с любого этапа, когда нужна помощь или есть чем поделиться.
        required_fields:
          - Вопрос или предложенное улучшение и его польза.
        action: Объяснять способ и доступность помощи уже при выборе; рассматривать полезные вопросы и предложения по
          возможности.
        exit_condition: Предложение или направление принято, уточнено, отклонено либо оставлено открытым.
        failure: "Помощь недоступна или приоритеты различаются: найти другой источник либо оставить изменение в своём
          проекте."
        metric: Полезные ответы, принятые улучшения и повторяющиеся потребности.
  - id: developer-agents
    name: Агенты-разработчики, выбирающие основу для человека или команды
    audience: "Долгосрочный путь применения: агент рассматривает SPS при выполнении поставленной человеком задачи
      по созданию продукта."
    roles: Агент сравнивает и использует готовый код в пределах поручения. Человек или команда владеет проектом и
      определяет, что агенту разрешено менять. Покупка кода не требуется.
    needs:
      - Соотнести бизнес-результат с готовыми функциями; широкая основа полезна только при соответствии задаче.
      - Найти понятные инструкции и отделить общие соглашения от решений человека о продукте.
      - Объяснить ответственному человеку соответствие, оставшуюся работу, усилия на освоение и альтернативы.
    motivations:
      - Выполнить задачу человека, сосредоточив работу на особенностях продукта.
      - Переносить подходящие функции и понятные инструкции в задачи, где это полезно человеку или команде.
      - Объяснить выбор основы так, чтобы человек мог понять и поддерживать результат в своих ограничениях.
    decision_criteria:
      - Польза готовых функций оправдывает SPS по сравнению с минимальной генерацией или расширением текущего
        проекта.
      - Документация и примеры помогают понять основу; освоение соглашений и переход с прежней работы
        оправданы повторным использованием.
      - Поддержка, изменения и ожидания помощи соответствуют потребностям и ресурсам человека.
      - Выбор соблюдает полномочия человека, условия MIT и бесплатного кода; инструменты и сервисы
        оплачиваются отдельно.
    purchase_trigger: Человек поручает новый продукт или поиск подходящей основы. Это запускает рекомендацию или
      выбор в пределах полномочий, а не покупку агентом.
    value_proposition: Выбрать по брифу подходящие готовые функции, добавить порученные правила и объяснить
      человеку, как проверить результат.
    objections:
      - concern: Другая основа или существующий проект уже дают достаточно для задачи.
        response: Сравнить пользу готовых функций с освоением, переходом и поддержкой. Сохранить проект, создать
          только недостающее или выбрать другую основу, если это лучше для брифа.
        evidence: "Краткое сравнение SPS, альтернатив и текущей работы: особая логика бизнеса, незнакомые соглашения,
          поддержка и помощь."
      - concern: Поручение не разрешает менять основу или тратить деньги на внешние сервисы.
        response: Объяснить выбор ответственному человеку и действовать в данных полномочиях. Отделить расходы
          сервисов и инструментов от бесплатного кода.
        evidence: "Пример рекомендации: основа, обоснование, ограничения человека и необязательные внешние расходы."
      - concern: Инструкции для агентов сами по себе не доказывают, что SPS — лучший выбор.
        response: Связать документированные функции и инструкции с брифом. Экономию описывать как ожидаемую пользу, а
          не измеренный результат.
        evidence: "Разобранный пример: бизнес-бриф, документация модулей, инструкции проекта и показанный человеку
          результат."
    acquisition:
      - id: human-referral
        channel: Ссылка на проект от человека
        context: Человек просит использовать или рассмотреть SPS после демонстрации или предыдущего опыта.
        message: Используйте основу там, где она помогает нужному бизнес-результату.
        cta: Прочитать инструкции проекта
        destination: Обзор репозитория, инструкции агента и бриф продукта человека.
      - id: task-discovery
        channel: Документация для поисковых задач и знакомство с репозиторием
        context: Поручение включает сравнение основ для общих бизнес-функций.
        message: Сопоставьте описанные готовые функции с потребностями продукта.
        cta: Оценить соответствие задаче
        destination: Документация нужных функций и обзор репозитория; обнаружение и место в поиске не предполагаются
          заранее.
      - id: project-reuse
        channel: Существующий проект SPS и его инструкции
        context: Человек начинает ещё один продукт после использования основы.
        message: Используйте общую основу, но примите новые решения для нового продукта.
        cta: Рассмотреть SPS для нового брифа
        destination: Новый бриф и общие инструкции фреймворка без переноса бизнес-решений другого проекта.
    journey:
      - id: assigned-need
        name: Найти кандидата для задачи
        customer_goal: Найти подходящую основу для продукта человека.
        customer_action: Прочитать поручение и изучить предоставленную или найденную ссылку на SPS.
        customer_question: Какие потребности брифа соответствуют основе?
        experience: "Желаемый рабочий контекст: ясное поручение и подходящие описания источников без подразумеваемого
          разрешения менять направление."
        touchpoint: Бриф человека, обзор репозитория и документация задачи.
        owner: Человек задаёт задачу; агент рассматривает кандидатов.
        entry_conditions:
          - Поручен новый продукт или сравнение основ.
        required_fields:
          - Бизнес-цель, важные функции и переданные полномочия.
        action: Описать область основы и направить агента к нужным инструкциям.
        exit_condition: SPS входит в подходящий список либо исключается.
        failure: "Мало совпадений с брифом: рассмотреть другую основу."
        metric: Задачи, в которых рассматривался SPS, при добровольном сообщении.
      - id: fit-recommended
        name: Объяснить выбор человеку
        customer_goal: Выбрать основу по причинам, связанным с бизнес-брифом.
        customer_action: Сравнить готовые функции, оставшуюся работу, незнакомые соглашения, переход и поддержку с
          текущим проектом или меньшей альтернативой; объяснить рекомендацию.
        customer_question: Почему эта основа подходит продукту этого человека?
        experience: "Желаемый рабочий контекст: понятная рекомендация, ясные границы и сохранённые полномочия человека."
        touchpoint: Разговор с агентом, описание продукта и нужная документация.
        owner: Агент рекомендует; человек или команда принимает решение.
        entry_conditions:
          - Основа кажется подходящей поручению.
        required_fields:
          - Соответствие брифу, оставшаяся работа, усилия внедрения, обязанности и ограничения человека.
        action: Предоставить область применения, примеры, инструкции, пределы помощи и отдельные расходы для
          конкретного сравнения.
        exit_condition: Человек выбирает вариант либо агент выбирает в пределах переданных полномочий.
        failure: "Рекомендация отклонена или задача изменилась: рассмотреть альтернативы либо уточнить бриф."
        metric: Принятые, отклонённые и отложенные рекомендации с сообщёнными причинами.
      - id: foundation-adopted
        name: Использовать основу для порученного продукта
        customer_goal: Начать работу с готовыми общими функциями.
        customer_action: Использовать основу с GitHub и её инструкции для проекта человека.
        customer_question: Что общее, а какие решения принадлежат новому продукту?
        experience: "Желаемый рабочий контекст: понятная связь общих функций и инструкций конкретного проекта."
        touchpoint: Репозиторий, инструкции агента и бриф.
        owner: Агент работает в выбранных человеком границах.
        entry_conditions:
          - SPS выбран в пределах полномочий поручения.
        required_fields:
          - Актуальный бриф и относящиеся к задаче инструкции.
        action: Предоставить код, документацию и последовательность перехода от бизнеса к продукту.
        exit_condition: Порученный продукт разрабатывается на SPS.
        failure: "Человек откладывает или меняет направление: приостановиться либо использовать выбранную
          альтернативу."
        metric: Принадлежащие людям проекты, выбравшие SPS по рекомендации или решению агента.
      - id: business-value-developed
        name: Адаптировать основу к бизнесу человека
        customer_goal: Создать полезный продукт с заданными бизнес-правилами.
        customer_action: Использовать подходящие функции, добавить порученные правила и объяснить человеку
          получившиеся задачу клиента и бизнес-результат.
        customer_question: Отвечает ли результат заданной человеком бизнес-потребности?
        experience: "Желаемый рабочий контекст: видимый прогресс продукта и конкретная обратная связь человека, а не
          необъяснённое изменение кода."
        touchpoint: Разговор с агентом, интерфейс и предполагаемая задача клиента.
        owner: Агент разрабатывает предложение; человек оценивает пользу бизнесу.
        entry_conditions:
          - Продукт человека разрабатывается на основе.
        required_fields:
          - Желаемое поведение и определение полезного результата человеком.
        action: Поддержать разработку особенностей продукта документированными функциями и примерами.
        exit_condition: Человек получил полезный результат либо задал новое направление.
        failure: "Результат не решает задачу: уточнить бриф или предложить другой подход."
        metric: Сообщённые человеком полезные результаты, доработки и повторно использованные функции.
      - id: reuse-recommended
        name: Помочь продолжению и следующему выбору
        customer_goal: Применить полезный опыт в дальнейшей работе человека или команды.
        customer_action: Продолжать продукт, рассмотреть SPS для другого подходящего брифа, показать человеку вопросы
          или улучшения.
        customer_question: Что использовать снова, а что выбрать заново?
        experience: "Желаемый рабочий контекст: повторно используемые инструкции, отдельные новые бизнес-решения и
          добровольное участие в сообществе."
        touchpoint: Инструкции текущего проекта, следующий бриф и согласованные человеком обращения или предложения.
        owner: Человек задаёт следующую задачу и решает, чем делиться; агент помогает.
        entry_conditions:
          - Продолжение или новая задача выигрывает от предыдущего опыта.
        required_fields:
          - Новая или текущая бизнес-цель и решение человека о передаче материалов.
        action: Сохранять инструкции пригодными для разных проектов; рассматривать вопросы и предложения через те же
          каналы помощи по возможности.
        exit_condition: Продолжение использования, повторный выбор, добровольный вклад либо другая основа.
        failure: "Потребности расходятся или помощь недоступна: выбрать другой подход без подразумеваемого
          обязательства постоянной поддержки."
        metric: Повторный выбор, следующие проекты людей и добровольные улучшения.
