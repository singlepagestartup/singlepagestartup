schema: singlepagestartup.sales-process.v2
product_id: ai-chat
readiness: ready
owner: Все этапы продаж и обслуживания сейчас ведёт создатель SinglePageStartup.
seller: AI Chat обслуживает создатель SinglePageStartup. Платежи принимаются в России через онлайн-кассу.
  Юридическое имя получателя, реквизиты и выдачу чеков оператор настраивает в интерфейсе продукта; здесь это
  не решение предпроектного этапа.
pricing: "Покупки токенов описаны в источниках выручки продукта AI Chat. Расход провайдера зависит от
  использованных запросом токенов; большая доля приходится на генерацию. Клиент не выбирает модель:
  маршрутизатор выбирает её для каждого запроса из доступных моделей продукта. Их цены различаются примерно на
  порядок, поэтому баланс списывается по денежной стоимости запроса, а не по числу токенов провайдера. Один
  внутренний токен соответствует USD 0.001 расходов провайдера. При отправке ввода модели списывается один
  токен; после получения ответа баланс пересчитывается по фактической стоимости. Токены продаются в рублях с
  наценкой 30% к расходу провайдера при фиксированном курсе 100 рублей за доллар: цена для клиента — 0,13
  рубля за токен, минимум успешного запроса — 0,13 рубля. При ошибке или отмене возвращаются все списания
  запроса, включая начальный токен и перерасчёт. Итоговая плата — ноль, даже если провайдер понёс расходы.
  Купленные токены не сгорают. Покупки обычно окончательны; денежный возврат пополнения решается индивидуально
  и не заявлен как общее право. Пять пакетов: 100, 300, 500, 1 000 и 3 000 рублей с одинаковой ценой токена,
  без скидки за больший пакет. Баланс может стать отрицательным. При −2 000 внутренних токенов или ниже, что
  соответствует USD 2 долга по расходам провайдера, новые платные AI-запросы ограничиваются до пополнения выше
  этого порога. Порог не ограничивает итоговую стоимость уже отправленного запроса."
capacity: Сервис ведёт один владелец проекта; обращения в поддержку обрабатываются в течение 24 часов.
  Непрерывная поддержка в реальном времени и более высокий уровень сервиса не определены.
blockers: []
segments:
  - id: business-users
    name: Владельцы проектов на ранней стадии
    audience: Предприниматели и маркетологи, которым нужны согласованные знания о бизнесе и материалы на их
      основе. Первая задача может быть статьёй, рекламным креативом, описанием продукта или техническим
      заданием.
    roles: Обычно один человек — пользователь, выгодополучатель и принимающий решение; он же может покупать и
      оплачивать токены. В организациях покупатель, плательщик и полномочия определяются для каждого клиента.
    needs:
      - Загрузить заметки, документы, изображения и решения, заранее не распределяя каждое по разделам.
      - Проверить краткие письменные бриф, стратегию, бренд и дизайн, а также отдельные продукты.
      - "Сохранить документы каждого продукта: описание, аудиторию, конкурентов, семантику, экономику и
        продажи, со ссылками на источники и исследования."
      - Подготовить содержание сайта, рекламы и презентации, когда они нужны продукту. Готовый сайт и
        медиаматериалы в первый этап не входят.
      - Обсуждать и редактировать каждый файл в своём чате, сохраняя разговор рядом с черновиком.
      - Видеть пробелы, предложения и противоречия и исправлять их в обычном разговоре.
      - Создавать темы проекта и прикреплять выбранные документы без повторного объяснения их содержания.
      - Экспортировать структуру и свободно использовать её вне сервиса.
      - Добавлять детали без копий, которые придётся обновлять вручную.
    motivations:
      - Собрать описание бизнеса из материалов, которые уже есть.
      - Использовать сохранённые сведения в новых разговорах, не объясняя проект заново.
      - Иметь постоянного собеседника, который помогает развивать идеи и замечает слабые места.
      - Контролировать факты, правки, принятые документы и их использование вне сервиса.
      - Платить за продолжение, когда польза продукта уже понятна.
    purchase_trigger: Баланс достигает отрицательного лимита и новые запросы ограничиваются либо человек пополняет
      его раньше. Он выбирает пакет с понятной ценой, чтобы продолжить сохранённую настройку, работу с
      документами, обсуждение или создание материала.
    decision_criteria:
      - Материалы и ответы превращаются в связные описания проекта и отдельные документы продуктов на понятном
        языке.
      - Первая сессия рассчитана примерно на один сосредоточенный час без принудительного завершения и
        вымышленных ответов.
      - У каждого продукта сохраняется полная структура; недостающие решения и доказательства остаются
        видимыми.
      - Видно, куда помещена информация; её можно исправить и принять.
      - При переключении чатов каждый файл сохраняет своё обсуждение и правки.
      - Выбранные документы дают контекст отдельным темам проекта.
      - Проверенный документ остаётся доступен во время правки следующего черновика; незавершённые разделы не
        мешают использовать проверенное.
      - Агент разбирает предположения и объясняет, какие факты поддерживают идею, а какие ей противоречат.
      - Неизвестное мешает только тем решениям, для которых оно необходимо.
      - Понятны условия продолжения, обработки данных и поддержки.
    value_proposition: "Соберите знания о бизнесе в одном проекте: продукты, аудитория, предложение, стратегия и
      язык бренда. Используйте этот контекст для статей, рекламы, презентаций и технического задания."
    objections:
      - concern: У меня есть заметки и документы, но я не знаю, к какому разделу относится каждый материал.
        response: Передайте материалы как есть или ответьте на вопросы; AI Chat предложит структуру для исправления и
          принятия.
        evidence: Показать распределение разных источников по разделам с отмеченными пробелами.
      - concern: Придётся повторять предысторию в каждом запросе.
        response: Прикрепите документы, нужные теме. AI Chat использует их контекст и спросит то, чего не хватает
          текущей задаче.
        evidence: Показать отдельную тему с выбранными проверенными документами и документ, на котором основан ответ.
      - concern: Первый этап создаёт или публикует посадочную страницу?
        response: Первый этап даёт письменные документы проекта и продуктов. Сборка страницы, редактор блоков и
          платное развёртывание появятся позже. Их цены и доступность не определены и не меняют текущее
          текстовое предложение.
        evidence: Показать документы и границы первого этапа. Будущий пример публикации обозначать как требование к
          следующему этапу, а не доступное действие или наблюдаемый результат.
      - concern: Короткое описание может скрыть недостающие бизнес-решения.
        response: Краткие документы сохраняют структуру, а каждый продукт — полный набор разделов. Неизвестные
          решения, противоречия и недостающие доказательства остаются видимыми.
        evidence: "Показать документы двух продуктов: предложение, аудиторию, конкурентов, семантику, экономику и
          продажи. Продемонстрировать ссылки на источники и открытый вопрос."
      - concern: Чат может просто соглашаться с каждой идеей.
        response: AI Chat может проверять предположения, выявлять противоречия, сравнивать альтернативы и объяснять
          критику с опорой на принятый контекст проекта.
        evidence: Показать обсуждение идеи, выявляющее слабое предположение и альтернативу с указанным основанием.
      - concern: Обычного ассистента или отдельных документов уже может хватить.
        response: Сравнить AI Chat с альтернативами на одинаковом запросе и ожидаемом результате.
        evidence: Использовать документированное сравнение конкурентов и сопоставимую демонстрацию. Не заявлять
          превосходство без результатов.
    acquisition:
      - id: demonstration
        channel: Полная демонстрация и короткие вертикальные фрагменты
        context: У человека есть идея, заметки или частичные решения, которые ещё не стали связным проектом.
        message: Отправьте заметки, фотографии и файлы в чат. Проверьте пробелы, редактируйте каждый файл с агентом в
          его чате и прикрепляйте сохранённые документы к новым темам.
        cta: Посмотреть, как работает AI Chat
        destination: Посадочная страница AI Chat или подходящее полное объяснение
      - id: search
        channel: Объяснения под поисковые запросы
        context: Человек ищет помощь с бизнес-брифом, стратегией, позиционированием или описанием продукта.
        message: Обсудите вопрос с агентом и сохраните ответ в документе проекта.
        cta: Начать с этой задачи
        destination: Объяснение задачи со ссылкой на создание проекта
      - id: community
        channel: Ответы по контексту в сообществах
        context: Основатель или создатель задаёт конкретный вопрос о бизнесе или продукте в подходящем сообществе.
        message: Сначала дать полезный ответ, затем сослаться на соответствующий пример, если правила сообщества это
          разрешают.
        cta: Посмотреть пример
        destination: Подходящее объяснение или страница AI Chat
    journey:
      - id: discover
        name: Увидеть чат проекта в работе
        customer_goal: Найти способ собрать описание проекта из имеющихся материалов.
        customer_action: Посмотреть или прочитать пример и решить, подходит ли он ситуации.
        customer_question: Сможет ли ассистент использовать условия моего бизнеса в нужном мне материале?
        experience: Короткий обзор показывает загруженные файлы, вопросы агента, обсуждение и редактор файла,
          состояние проверки и новую тему с прикреплёнными документами.
        touchpoint: Демонстрация, результат поиска, короткий фрагмент или ответ в сообществе
        owner: Владелец проекта готовит и показывает примеры; посетитель решает, продолжать ли.
        entry_conditions:
          - У человека есть текущий проект, идея или решение с разрозненными данными.
        required_fields:
          - Для знакомства личная информация не требуется.
        action: Показать загрузку, пробелы, найденные агентом, обсуждение и правку каждого файла, затем выбранные
          проверенные документы в новой теме. Первое объяснение должно укладываться примерно в 15 секунд;
          понимание ещё не измерялось.
        exit_condition: Посетитель начинает проект, ищет подробности, откладывает или уходит.
        failure: "Пример не подходит: можно выбрать другой подход или вернуться с будущим проектом."
        metric: Релевантные посещения и пользователи, решившие начать проект.
      - id: access
        name: Войти в рабочее пространство
        customer_goal: Понять условия доступа и начать работу.
        customer_action: Изучить предложение, зарегистрироваться по электронной почте и паролю и войти.
        customer_question: Что здесь можно делать и что произойдёт с переданной информацией?
        experience: Прямая регистрация или вход по почте и паролю, затем чат проекта для добавления материалов. Вход
          через соцсети не предлагается.
        touchpoint: Страницы регистрации и входа
        owner: Пользователь регистрируется и входит; владелец обслуживает доступ и предложение.
        entry_conditions:
          - Человек хочет использовать облачное рабочее пространство.
        required_fields:
          - Электронная почта и пароль.
        action: Зарегистрировать или авторизовать аккаунт, показать баланс токенов и открыть чат для загрузки.
        exit_condition: Человек принимает условия и входит, запрашивает пояснение или отказывается.
        failure: Если условия не подходят, можно запросить пояснение, вернуться позже или выбрать другой сервис.
          Поддержка обрабатывает обращения в течение 24 часов.
        metric: Регистрации, успешные входы, ошибки доступа и добровольно сообщённые причины отказа.
      - id: describe
        name: Загрузить и проверить материалы проекта
        customer_goal: Превратить файлы, изображения и частичные знания в письменное описание проекта и каждого продукта.
        customer_action: "Передать заметки, документы и изображения о бизнесе. Выбрать первую задачу: описание
          продукта, статья, реклама или техническое задание. Уточнить сведения в диалоге и сохранить их в
          документах проекта."
        customer_question: Что нужно решить сейчас, а что может оставаться неизвестным?
        experience: Создание проекта, загрузка и анализ — отдельные экраны до чатов документов. Загруженные файлы
          видны рядом с рабочими документами. У каждого файла свои обсуждение и редактор. Агент указывает
          пробелы и противоречия; индикаторы показывают наличие данных и потребность в доработке или проверке.
          До загрузки не нужно изучать структуру; баланс токенов остаётся виден.
        touchpoint: Название проекта, загрузка, анализ и чаты документов
        owner: Пользователь предоставляет и принимает факты; владелец обеспечивает сбор данных и работу с документами.
        entry_conditions:
          - У пользователя есть доступ и проект или идея для развития.
        required_fields:
          - Имеющиеся файлы, изображения или факты для задачи; явное указание неизвестного, когда ответа нет.
        action: Создать именованный проект, принять материалы, показать ход анализа и распределить сведения по кратким
          письменным брифу, стратегии, бренду и дизайну. Задавать по одному существенному вопросу, сохранять
          источник утверждения. Открыть каждый файл отдельным чатом. Для каждого продукта — описание,
          аудитория, конкуренты, семантика, экономика и продажи со ссылками на исследования. При необходимости
          подготовить тексты сайта, рекламы и презентации. Отмечать пробелы и противоречия без выдуманных
          ответов. Индикаторы отражают содержание и проверку, а не доказанный спрос или жизнеспособность
          бизнеса.
        exit_condition: Документы проекта и черновики продуктов доступны в своих чатах для проверки либо неполная
          работа сохранена с пробелами.
        failure: При отрицательном лимите можно пополнить баланс, остановиться или вернуться без потери задачи.
          Недостающий ответ связать с затронутым решением и продолжить остальное либо вернуться позже.
        metric: Описанные проекты, черновики, покрытие разделов продуктов, вопросы, неизвестное, противоречия и места
          ухода.
      - id: purchase
        name: Пополнить токены и вернуться к работе
        customer_goal: Продолжить задачу без потери материалов и сделанной работы.
        customer_action: Открыть токены, сравнить пакеты, выбрать, оплатить и вернуться к прерванной задаче.
        customer_question: Что я покупаю, сколько это стоит и куда вернусь после оплаты?
        experience: До оплаты видны баланс, состав пакета, полная цена и условия. После успешной оплаты — возвращение
          к сохранённой задаче.
        touchpoint: Баланс токенов и страница покупки
        owner: Пользователь выбирает и оплачивает пакет; владелец обеспечивает приём оплаты и российские онлайн-чеки.
        entry_conditions:
          - Баланс достиг отрицательного лимита либо пользователь пополняет его раньше.
        required_fields:
          - Выбранный пакет и платёжные данные, требуемые настроенным способом оплаты.
        action: Сохранить работу, показать пакеты и условия, принять оплату, начислить токены и вернуть к задаче.
        exit_condition: Токены начислены и работа продолжается; пользователь выбирает другой пакет, откладывает или уходит.
        failure: При отказе или неудаче можно выбрать другой пакет, обратиться за помощью, отложить или вернуться без
          покупки.
        metric: Открытия оплаты, успешные и неудачные покупки, выбор пакета, возвращение к задаче и повторные покупки.
      - id: review
        name: Исправить, принять и экспортировать документы
        customer_goal: Проверить факты в документах проекта и продуктов, уточнить открытые вопросы.
        customer_action: Открыть чат файла, обсудить пробелы, проверить текст в редакторе, исправить, явно сохранить и
          проверить результат, перейти к другому файлу или экспортировать.
        customer_question: Объясняет ли это работу моего бизнеса, пробелы и дальнейшие действия?
        experience: При переключении каждый файл сохраняет разговор, черновик и проверенную версию. Индикаторы
          различают имеющийся текст, недостающие данные и ожидающую проверку. Последняя проверенная версия
          доступна при правке нового черновика. Продукты сохраняют свои разделы и вопросы.
        touchpoint: Отдельные чаты документов с обсуждением и редактором
        owner: Пользователь принимает или исправляет описание; владелец обеспечивает результат и изучает исправления.
        entry_conditions:
          - Доступны черновики брифа, стратегии, бренда, письменного дизайна и отдельных продуктов.
        required_fields:
          - Письменные описания, разделы каждого продукта, видимые предположения, неизвестное, пробелы
            доказательств и исправления пользователя.
        action: Разобрать недостатки в чате затронутого файла. Предложить правки в редакторе для исправления,
          сохранения и проверки пользователем; заполненный агентом черновик не считается принятым. Обновлять
          содержание и индикаторы файла, сохранять последнюю проверенную версию до проверки нового черновика.
          Оставлять вопросы видимыми. Разрешать экспорт и прикрепление проверенных документов без завершения
          всех файлов. Экспортированные результаты можно свободно использовать вне сервиса.
        exit_condition: Пользователь принимает текст, исправляет раздел, экспортирует, открывает тему с файлами либо
          оставляет вопросы на потом.
        failure: Сохранить принятые части, показать противоречие и запросить только необходимое уточнение.
        metric: Принятые и исправленные документы, циклы правок, полнота продуктов, пробелы, противоречия, отзывы о
          пользе, экспорт и повторный ввод.
      - id: continue
        name: Развивать и проверять идеи
        customer_goal: Обдумать новую идею или выполнить задачу без повторного объяснения проекта.
        customer_action: Выбрать документы продукта и подготовить следующую статью, рекламный материал, презентацию
          или техническое задание. Поправки в цене, аудитории и условиях сохраняются в соответствующих
          документах проекта.
        customer_question: Могу ли я использовать согласованное, проверить идею и поменять только нужное?
        experience: Тема сохраняет своё обсуждение и выбранные документы. Агент использует их проверенные версии,
          объясняет поддержку или противоречие идее и спрашивает недостающее. Документ редактируется в
          собственном чате; тема остаётся доступна.
        touchpoint: Общее пространство проекта с отдельными темами и сохранёнными файлами
        owner: Пользователь направляет работу; владелец сохраняет доступ и контекст.
        entry_conditions:
          - Есть хотя бы один сохранённый проверенный документ и новая задача; другие файлы могут быть не
            завершены.
        required_fields:
          - Тема, следующий запрос, выбранные документы, существенное изменение и применимые условия доступа.
        action: Открыть тему с выбранным контекстом. Держать её обсуждение отдельно. Предложения правок направлять в
          чат файла для редактирования и проверки пользователем; до проверки замены использовать последнюю
          проверенную версию. Показывать содержание и состояние проверки. При отправке ввода списать один
          токен; после успешного ответа пересчитать по фактической стоимости. При ошибке или отмене вернуть
          все списания до нулевой итоговой платы. Сохранять задачу, разрешать работу в пределах отрицательного
          лимита и предлагать покупку при его достижении.
        exit_condition: Задача выполнена, пользователь покупает токены, делает паузу или уходит.
        failure: "Потребность закончилась или продукт не подходит: можно остановиться, уйти, вернуться позже или
          выбрать другой подход."
        metric: Выполненные задачи, исправленные после обсуждения решения, возвращения в чат, повторные покупки,
          повторный ввод сведений и причины остановки.
      - id: manage
        name: Управлять аккаунтом и проектом
        customer_goal: Изменить настройки и понять состояние сервиса.
        customer_action: Изменить пароль или посмотреть покупки в настройках аккаунта. Выбрать проект в чате для
          переименования и управления документами. Запросить удаление аккаунта из настроек.
        customer_question: Где изменить аккаунт, проект, платежи или сохранённые документы?
        experience: Настройки аккаунта содержат пароль, покупки и действия с данными. У каждого проекта свои настройки
          в чате.
        touchpoint: Настройки аккаунта и выбранного проекта в чате
        owner: Пользователь выбирает изменение; владелец обеспечивает действие сервиса.
        entry_conditions:
          - Пользователь авторизован.
        required_fields:
          - Только сведения, необходимые выбранному действию.
        action: Показать общие настройки аккаунта и отдельные настройки проекта в его чате. Выполнять только выбранное
          действие.
        exit_condition: Настройка сохранена, пользователь возвращается, запрашивает помощь или выходит из аккаунта.
        failure: Если действий не хватает, можно обратиться за помощью, отложить изменение или запросить выход из
          сервиса.
        metric: Действия в настройках, незавершённые изменения, запросы удаления и переходы в поддержку.
      - id: support
        name: Получить помощь
        customer_goal: Разрешить вопрос о продукте или условиях и решить, как продолжать.
        customer_action: Описать вопрос, желаемый результат и контекст проекта.
        customer_question: Где получить помощь и какого ответа ждать?
        experience: Понятный способ обращения; обработка в течение 24 часов.
        touchpoint: Выбранный канал помощи
        owner: Пользователь описывает потребность; единственный ответственный за обработку — владелец проекта.
        entry_conditions:
          - Нужно пояснение о доступе, материалах, документах, правках, контекстном чате, экспорте или покупке.
        required_fields:
          - Вопрос, нужный результат и относящийся к нему контекст.
        action: Обработать обращение в течение 24 часов и ответить в пределах текущего сервиса.
        exit_condition: Пользователь получил направление, принял результат, узнал следующий шаг или оставил вопрос открытым.
        failure: Если сервис не решает вопрос, объяснить ограничение и предложить шаг, другой источник, паузу или
          выход из сервиса.
        metric: Повторяющиеся запросы, время первого ответа, полезные ответы, нерешённые вопросы и неоправданные
          ожидания.
