schema: singlepagestartup.product-presentation.v1
product_id: ai-chat
content:
  name: AI Chat
  subtitle: Product and business overview
  slides:
    - id: problem
      label: The problem
      title: The project is still spread across files and unfinished decisions.
      lead:
        A person starting a business alone may already have notes, photographs,
        research, screenshots and ideas
        but still lack one connected explanation of the customer, offer, sales,
        operations and marketing.
      points:
        - Important knowledge remains scattered and difficult to reuse.
        - A fresh conversation may require explaining the project again.
        - Products need their own offers, delivery plans and economics.
    - id: result
      label: The result
      title: Build an editable knowledge base for the project.
      lead:
        The intended AI Chat flow turns uploaded material and answers into short
        project and product documents. Each file has its own thread for discussion
        and editing with the agent. Selected saved documents become the context
        for new topics in the project workspace.
      points:
        - Brief records the starting material; Strategy sets the direction; Brand defines the promise, evidence and voice.
        - Design is a written description of the intended appearance, existing assets and constraints.
        - Products contains separate descriptions for each product, with customer and offer in Product, Operations & Economics, Sales, Promotion, Analytics and applicable Research. Promotion includes Website, Creative and Presentation text where relevant.
        - Edit the documents, accept them and freely export them for use elsewhere.
    - id: intake
      label: Start in chat
      title: Bring your files into the conversation.
      lead: After registration, the person uploads material in chat. The agent
        reviews it, drafts the relevant sections and identifies missing or
        contradictory information. The first setup is structured for about one
        focused hour; unanswered questions can remain open.
      points:
        - Email-and-password registration and sign-in.
        - Notes, documents, screenshots and photographs enter a project chat.
        - Uploaded files and drafted sections remain available during the conversation.
        - Visible token balance and saved progress.
    - id: workspace
      label: Review and continued work
      title: Work on the files together. Keep the reviewed context.
      lead: Each intended document thread keeps its own discussion, edits and
        agent interaction. Section indicators show what is present and what still
        needs work. In the general project workspace, the person creates topics
        and chooses which saved documents to attach to each conversation.
      points:
        - Work through the gaps and contradictions the AI agent identifies.
        - Keep supplied facts, assumptions and unanswered questions distinct.
        - Discuss and edit each file in its own thread; revisit affected sections when information changes.
        - Keep the reviewed version available as topic context while revising a new draft.
        - Continue with selected saved documents while other sections still have open questions.
        - Accept the text and export the documents for use elsewhere.
    - id: landing-page
      label: Later development
      title: A landing page can follow the project description.
      lead: A later stage will let the AI agent build a landing page from the
        accepted documents, with the aim of collecting initial enquiries and
        testing a hypothesis. The owner evaluates and improves project
        description before selling server deployments.
      points:
        - Landing-page assembly, editing and server publication are subsequent development.
        - The first-stage offer is written project and product documents.
        - Initial enquiries and hypothesis testing are intended purposes, not guaranteed results.
        - Deployment availability and prices are undecided.
    - id: tokens
      label: Paid continuation
      title: Top up the balance and continue your saved work.
      lead:
        Top up at any time. The balance may go below zero; at −2,000 internal
        tokens or lower, new paid AI requests are restricted. A top-up above
        that threshold permits new paid requests on the saved task.
      points:
        - 0.13 roubles per token; top-ups of 100, 300, 500, 1,000 or 3,000 roubles without package discounts.
        - Purchased tokens do not expire; cash refunds for top-ups are decided case by case.
        - Charge one token on sending input; successful requests settle actual cost rounded up to a whole token, with a 0.13-rouble minimum.
        - Failed or cancelled requests restore every deduction, including the initial token and settlement, for a net charge of zero. The service bears provider expense.
    - id: account
      label: Account and support
      title: Registration, settings, purchases and help have explicit places.
      lead:
        The complete product journey includes account access, project settings,
        purchase history, saved project documents and a support route processed by
        the project owner.
      points:
        - Register or sign in with email and password.
        - Manage project and account settings; read the processing and backup-retention disclosure before upload or deletion.
        - View token purchases and return to saved work.
        - Send a support request with a 24-hour processing boundary.
    - id: framework
      label: Code Framework
      title: Use Code Framework when the project needs software.
      lead:
        SinglePageStartup Code Framework is the existing reusable codebase for
        a site, chatbot or another digital product. Choose the relevant common
        functions, adapt them with a coding agent and review the result.
      points:
        - Reuse relevant functions such as registration and payments.
        - Adapt the rules and interface for the particular product.
        - Deploy the adapted code to the user's own server.
        - Framework code is free; coding-agent use and infrastructure have separate costs.
    - id: action
      label: The next action
      title: Bring your project into chat.
      lead: Upload notes, photographs and documents, or describe the project in
        your own words. Work through the agent's questions and corrections.
        Attach selected saved files to your next topic in the project workspace.
      points:
        - Upload the material already available.
        - Work on each project and product file in its own thread with the agent.
        - Review the text and keep unanswered questions visible.
        - Export the documents or continue working with them in chat.
