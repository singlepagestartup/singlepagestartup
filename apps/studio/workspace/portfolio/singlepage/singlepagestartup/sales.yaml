schema: singlepagestartup.sales-process.v1
product_id: singlepagestartup
readiness: blocked
owner: Founder
seller: No seller; the framework is free and founder-funded
pricing: Free evaluation and use; no framework payment
capacity: First experiment is limited to six founder hours per week and eighteen total
blockers:
  - Publish the selected license and one authoritative setup contract before acquisition starts.
  - Verify the showcase bridge, attribution, support boundary, and one capability check.
stages:
  - id: reached-explanation
    name: Reached framework explanation
    owner: Founder
    entry_conditions: [Target developer encounters the selected acquisition route]
    required_fields: [source, anonymous-or-attributable-visitor-id]
    action: Present the audience, scope, evidence, limits, and evaluation path.
    exit_condition: Developer opens the pinned evaluation destination.
    failure: Record no transition; do not count a view or service use as product interest.
    metric: Target developers reaching the framework explanation
  - id: recorded-decision
    name: Recorded evaluation decision
    owner: Founder
    entry_conditions: [Developer has a named or confidentiality-safe product need]
    required_fields: [product-need, decision, reason]
    action: Record whether the developer starts, rejects, or defers evaluation and why.
    exit_condition: One attributable decision and reason are stored.
    failure: Missing need or reason remains unqualified and receives no success label.
    metric: Qualified start, reject, or defer decisions
  - id: evaluation-started
    name: Evaluation started
    owner: Developer
    entry_conditions: [License, prerequisites, evidence, and limits reviewed]
    required_fields: [pinned-version, setup-started-at]
    action: Retrieve the pinned version and begin the documented setup.
    exit_condition: Setup begins for the named product need.
    failure: Record the blocking prerequisite or rejection reason; founder help is best effort.
    metric: Qualified evaluation starts
  - id: capability-checked
    name: Declared capability checked
    owner: Developer
    entry_conditions: [Setup completed]
    required_fields: [setup-result, capability, check-result]
    action: Exercise one capability declared before the evaluation.
    exit_condition: Setup and capability results are attributable and recorded.
    failure: Two independent failures on one controllable blocker pause acquisition for repair.
    metric: Independent successful-use checks
  - id: adoption-decided
    name: Adoption decision recorded
    owner: Developer
    entry_conditions: [Successful use completed]
    required_fields: [retain-or-reject, reason, follow-up-date]
    action: Record repeat use or an attributable decision to retain or reject the framework.
    exit_condition: The developer records a decision with a reason.
    failure: No follow-up is reported as missing evidence, never inferred adoption.
    metric: Repeat use or attributable retain decisions
