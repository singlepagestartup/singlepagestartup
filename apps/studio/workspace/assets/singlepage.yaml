  - id: singlepage-generated-living-focus-direction-reference
    design_role: null
    design_key: null
    path: assets/singlepage/generated/living-focus/living-focus-direction-reference.png
    source_type: generated
    lifecycle: proposed
    proposal_id: living-focus
    evidence: false
    rights_status:
      AI-generated concept board from supplied identity and private visual references;
      selected as a direction only. Its illustrative UI, copy and approximated marks are not
      production assets or product evidence.
    purpose:
      Preserve the selected Living Focus photographic and compositional direction as a reference
      input for the three new editorial photographs.
    related_artifacts:
      - singlepage.design
    allowed_use:
      - Internal direction comparison and photographic treatment input.
    prohibited_use:
      - Do not publish the board as a working application, product evidence, final logo or final
        typography specification.
      - Do not carry its JetBrains label into the current system; the subsequent operator selection
        requires Onest for all visible text.
    reference_asset_ids:
      - singlepage-operator-logo-square-black
      - singlepage-photography-reference-low-angle-sunburst
    dimensions:
      width: 1487
      height: 1058
    content_sha256: b1e7f1caaff72ac9f34bdff90849a01fad778c9b7eb6d347f53766855d56dfc6
    prompt: >-
      Use case: ui-mockup. Create a realistic, production-quality VISUAL SYSTEM concept board for
      SinglePageStartup, a brand with AI Chat for organizing existing business material into an
      editable project, and Code Framework for building software. This is a proposed reusable visual
      identity shown in Workspace Design, not a shipped application, pricing page or new marketing
      strategy. Exactly one cohesive direction in this image, not multiple options.

      Target dimensions: 1440 x 1024 desktop canvas, natural ratio. Clear hierarchy, strong
      typography, intentional imagery, purposeful whitespace. Show one primary brand statement, one
      compact original product-surface specimen, and a restrained type/color/media sampling. No dense
      feature inventory, pricing, testimonials, invented metrics, or unsupported claims.

      The operator rejects the CURRENT screenshot's warm paper surface, bookish thin serif headings
      and typewritten-manuscript mood, and perceived Anthropic resemblance. The current screenshot is
      attached ONLY as the design being replaced. Do not reproduce Storybook chrome, navy review-shell
      header, old warm background, the "Measured Space" name or old layout.

      Preserve the supplied pixel-grid S mark from its own reference, and exact SinglePageStartup
      name. Preserve #BFEF61 green accent. Use near-black text with good contrast. Typography must
      support Latin and Cyrillic. At most 2 font families.

      All external reference screenshots/photos are private mood/technique references only. Abstract
      their hierarchy, spacing, motion, light, and form; do not copy their layouts, text, marks,
      icons, people, scene or watermark. Create an original people-and-business photograph if used. No
      stock office cliches. Photography may have warm skin, cool surrounding light, gesture and blur;
      it does not mean the UI is warm or textured.

      Layout: use whitespace, alignment and hierarchy first, subtle dividers second; restrained
      surface fills when useful, minimal borders and shadows. Do not enclose the whole design in a
      floating card. No nested cards, gratuitous badges, gradients, fake telemetry, sparkle icons,
      decorative hand-drawn marks or paper effects.

      Use readable small type at 14–16px, comfortable lines under 65 characters. No clipped content.
      Do not stretch visual assets. Use original concise sample copy: "Make sense of what you already
      have." and one primary control "Organize my materials". A compact surface may show a sample
      "Coffee roastery" project with Notes / Business model / Discussion, clearly visual example
      content. Keep broad functionality off-screen.

      Date anchor: 2026-10-03; avoid dates in visible mock data. Show English design labels consistent
      with the current project. Polished art direction, not a UI kit exploded into dozens of tiles.

      Direction name: Living Focus.

      Explore a distinctly more human, vivid and image-led visual identity. This is explicitly a
      PROPOSAL to replace the old monospaced body with Onest, a modern proportional Cyrillic-capable
      sans; use JetBrains Mono only for tiny technical labels. Two families maximum. Crisp readable
      text, no serif or italic anywhere.

      The composition must differ strongly from the clean side-by-side dashboard direction. Use a
      large, beautifully art-directed original photograph of a small business owner turning toward a
      collaborator during a working conversation; cool blue/teal natural light, warm skin and one
      expressive moving gesture with subtle motion blur, inspired by the photographic techniques in
      references. The photography occupies one big asymmetric field, not many thumbnails. Avoid
      copying any person, outfit or scene from references.

      A clear, calm white working surface is anchored partly against that image with ample open space,
      focused on reviewing organized project material and a single green "Organize my materials"
      action. Make the relation between human and organized thought visible through composition, not
      decorative network graphics. Include only one short original overlay label on the photograph,
      not fake medical telemetry or floating badges.

      The board has a refined white upper band with exact supplied logo and name, strong medium-weight
      large type, and a dark cool graphite (#18232A) supporting block containing the concise statement
      "Make sense of what you already have." Smaller typography/color examples can sit quietly along
      the bottom edge; show white, cool graphite, light gray and exact #BFEF61. Green is a lively
      primary action, not text highlight marker.

      Keep UI minimum body 15px and modest 16px corners. White on the dark block; near-black on lime.
      Sufficient calm white area for an everyday product to breathe. It should feel approachable,
      current and photographic, with a unique brand rhythm, never a paper journal, generic AI-chat
      clone, dark developer dashboard or fitness ad.

      Input images: 1=current screenshot to replace; 2=exact required logo; 3=the six-tile source
      reference sheet covering all five source categories (abstraction only); 4=photographic
      perspective/light technique (never its copied person, visible words or watermark); 5=spare
      marketing typography reference (tone and spacing only).
    source_or_tool:
      Built-in imagegen, generation item exec-4ca5f894-a482-49ce-9383-e41d9124277f,
      2026-10-03. Exact revised prompt recovered from the task generation item. Inputs were the
      current Design screenshot, a raster of the required pixel S, a six-tile source reference sheet,
      the low-angle-sunburst original and a spare marketing typography reference. Exact helper-file
      paths and the final marketing-reference filename were not recovered, so no guessed asset ID is
      recorded. The subsequent operator selection excludes the proposed JetBrains label; the prompt
      remains immutable. The source PNG is copied unchanged.

