version: "3.7"

services:
  redis:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - /bin/sh
      - -c
      - >-
        test -n "$${REDIS_PASSWORD}" &&
        exec redis-server
        --port "$${REDIS_PORT:-6379}"
        --requirepass "$${REDIS_PASSWORD}"
    restart: always
    volumes:
      - ./redis_data:/root/redis
    env_file:
      - .env
    expose:
      - 6379
    ports:
      - ${REDIS_PORT}:6379
