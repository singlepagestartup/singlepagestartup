allOf:
  - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/repository/database/relation.yaml"
  - type: object
    properties:
      configurationKey:
        type: string
      settings:
        type: object
        description: Delivery, packaging and registration settings for this offer.
        properties:
          requiresResultAcceptance:
            type: boolean
            description: A commissioned service requires the customer to accept a result version.
          closedForNewOrders:
            type: boolean
            description: Preserve the offer for existing orders after closing it to new purchases.
          fullTextDraftPreview:
            type: boolean
            enum: [true]
            description: Show the complete text draft for commissioned PDFs in the order chat.
          workTokenPricing:
            type: object
            description: Charge for commissioned work from the customer's token balance.
            properties:
              currencyId:
                type: string
                format: uuid
              multiplier:
                type: string
            required:
              - currencyId
              - multiplier
          initialGrant:
            type: boolean
            description: An administrator can assign this offer to registered Subjects once per Product.
          initialGrantLegacyHistory:
            type: boolean
            description: Recognize matching zero-price registration orders issued before grants were marked.
      sku:
        type: string
        description: Sku
      storeId:
        type: string
        format: uuid
        description: Related store id
      productId:
        type: string
        format: uuid
        description: Related product id
    required:
      - sku
      - storeId
      - productId
