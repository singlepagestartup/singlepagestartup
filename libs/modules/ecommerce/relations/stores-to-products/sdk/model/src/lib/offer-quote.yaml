type: object
required:
  [
    offerId,
    productId,
    storeId,
    currencyId,
    quantity,
    amount,
    availableQuantity,
    currencyIds,
    serviceOptions,
    selectedServices,
    fulfillmentAlreadySatisfied,
    charges,
    issues,
    version,
    expiresAt,
  ]
properties:
  offerId: { type: string, format: uuid }
  productId: { type: string, format: uuid }
  storeId: { type: string, format: uuid }
  currencyId: { type: string }
  quantity: { type: integer, minimum: 1 }
  singleUnitPerOrder:
    type: boolean
    description: The primary product requires quantity one.
  amount:
    type: string
    nullable: true
    description: Total in major currency units. A null amount means the selection cannot be purchased.
  availableQuantity:
    type: integer
    nullable: true
    minimum: 0
    description: Available after reservations. Null means the offer has unlimited stock.
  currencyIds:
    type: array
    items: { type: string, format: uuid }
  serviceOptions:
    type: array
    items:
      type: object
      required: [offerId, productId, title, role, currencyIds]
      properties:
        offerId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        serviceKey:
          {
            type: string,
            description: Identity of a contractor service configuration and tariff.,
          }
        compatibleOfferIds:
          {
            type: array,
            items: { type: string, format: uuid },
            description: Equivalent service offer IDs accepted for existing cart selections.,
          }
        title: { type: string }
        titles: { type: object, additionalProperties: { type: string } }
        role: { type: string, enum: [delivery, add-on] }
        recurrence: { type: string, enum: [first, each] }
        receiptMethod: { type: string, enum: [shipping, pickup, electronic] }
        pricePreview:
          type: object
          required: [kind, amount]
          description: Fixed service charge or verified starting price for this offer, merchandise quantity and quote currency.
          properties:
            kind: { type: string, enum: [fixed, from] }
            amount:
              {
                type: string,
                description: Major currency units,
                rounded with the same precision as the final charge.,
              }
        deliveryTariff:
          type: object
          required: [basis]
          properties:
            basis: { type: string, enum: [fixed, distance, calculated] }
            fixedAmount:
              {
                type: string,
                description: Fixed delivery charge in the requested currency.,
              }
        regionIds: { type: array, items: { type: string } }
        currencyIds: { type: array, items: { type: string, format: uuid } }
  fulfillmentAlreadySatisfied:
    type: boolean
    readOnly: true
    description: Verified paid first-only fulfillment already covers this subscription period. Only trusted server context can establish this value.
  selectedServices:
    type: array
    description: Authoritative service selections, including the cheapest available fulfillment when none was selected. Returned even when a delivery address is still required. Pickup is at the selected retail store.
    items:
      type: object
      required: [offerId, quantity]
      properties:
        offerId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1 }
        lineId: { type: string, format: uuid }
  charges:
    type: array
    items:
      type: object
      required:
        [
          offerId,
          productId,
          storeId,
          providerStoreId,
          role,
          recurrence,
          quantity,
          amount,
          formula,
          formulaVersion,
          inputs,
          stockQuantity,
          availableQuantity,
        ]
      properties:
        offerId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        storeId: { type: string, format: uuid }
        providerStoreId: { type: string, format: uuid }
        role: { type: string, enum: [product, delivery, add-on] }
        recurrence: { type: string, enum: [first, each] }
        quantity: { type: integer, minimum: 1 }
        amount: { type: string }
        unitAmount:
          type: string
          nullable: true
          description: Merchandise formula quoted for quantity one in the same currency and configuration. Null means a one-item price is unavailable. Older servers omit this field.
        stockQuantity: { type: integer, minimum: 0, nullable: true }
        availableQuantity: { type: integer, minimum: 0, nullable: true }
        formula: { type: string }
        formulaVersion: { type: string }
        inputs: { type: object, additionalProperties: { type: string } }
  issues:
    type: array
    items:
      type: object
      required: [code, offerId, message]
      properties:
        code: { type: string }
        offerId: { type: string, format: uuid }
        message: { type: string }
        available: { type: integer, minimum: 0 }
  destination:
    type: object
    properties:
      address: { type: string }
      region: { type: string }
      coordinates:
        type: object
        required: [latitude, longitude]
        properties:
          latitude: { type: number, minimum: -90, maximum: 90 }
          longitude: { type: number, minimum: -180, maximum: 180 }
  version: { type: string }
  expiresAt: { type: string, format: date-time }
