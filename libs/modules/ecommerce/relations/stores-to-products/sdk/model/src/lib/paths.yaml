paths:
  /ecommerce/stores-to-products:
    get:
      tags:
        - "ecommerce-stores-to-products"
      summary: Get all entities
      description: Retrieve a list of all entities with optional filtering, sorting and pagination
      parameters:
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/query-builder/offset.yaml"
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/query-builder/limit.yaml"
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/query-builder/order-by.yaml"
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/query-builder/filters.yaml"
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/middleware/no-cache.yaml"
      responses:
        "200":
          description: List of entities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "ecommerce-stores-to-products.yaml"

    post:
      tags:
        - "ecommerce-stores-to-products"
      summary: Create a new entity
      description: Create a new entity
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  $ref: "ecommerce-stores-to-products-input.yaml"
              required:
                - data
      responses:
        "201":
          description: Created successfully
          content:
            application/json:
              schema:
                $ref: "ecommerce-stores-to-products.yaml"

  /ecommerce/stores-to-products/count:
    get:
      tags:
        - "ecommerce-stores-to-products"
      summary: Count entities
      description: Retrieve a count of all entities with optional filtering
      parameters:
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/query-builder/filters.yaml"
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/middleware/no-cache.yaml"
      responses:
        "200":
          description: Count of entities
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: integer

  /ecommerce/stores-to-products/{id}:
    get:
      tags:
        - "ecommerce-stores-to-products"
      summary: Get by ID
      description: Retrieve a specific entity by its ID
      parameters:
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/query-builder/id.yaml"
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/middleware/no-cache.yaml"
      responses:
        "200":
          description: Found successfully
          content:
            application/json:
              schema:
                $ref: "ecommerce-stores-to-products.yaml"

    patch:
      tags:
        - "ecommerce-stores-to-products"
      summary: Update entity
      description: Update a specific entity
      parameters:
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/query-builder/id.yaml"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  $ref: "ecommerce-stores-to-products-input.yaml"
              required:
                - data
      responses:
        "200":
          description: Updated successfully
          content:
            application/json:
              schema:
                $ref: "ecommerce-stores-to-products.yaml"

    delete:
      tags:
        - "ecommerce-stores-to-products"
      summary: Delete entity
      description: Delete a specific entity
      parameters:
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/query-builder/id.yaml"
      responses:
        "204":
          description: Deleted successfully
          content:
            application/json:
              schema:
                $ref: "ecommerce-stores-to-products.yaml"

  /ecommerce/stores-to-products/{id}/quote:
    post:
      summary: Calculate a retail offer and its selected services
      tags: [ecommerce-stores-to-products]
      parameters:
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/query-builder/id.yaml"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currencyId, quantity]
              properties:
                currencyId: { type: string }
                quantity: { type: integer, minimum: 1 }
                destination:
                  type: object
                  properties:
                    address: { type: string }
                    pickupPointId: { type: string }
                    region: { type: string }
                services:
                  type: array
                  items:
                    type: object
                    required: [offerId, quantity]
                    properties:
                      offerId: { type: string, format: uuid }
                      quantity: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Versioned charges, supported currencies, service options, available quantity and validation issues.
          headers:
            Cache-Control:
              schema: { type: string, example: "private, no-store" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "offer-quote.yaml" }
        "400": { description: Invalid selection or malformed destination. }
        "404": { description: Retail offer unavailable. }

  /ecommerce/stores-to-products/{id}/address-suggestions:
    post:
      summary: Suggest delivery addresses for a public shipping service offer
      tags: [ecommerce-stores-to-products]
      security: []
      parameters:
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/query-builder/id.yaml"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [query, language]
              properties:
                query: { type: string, minLength: 3, maxLength: 500 }
                language: { type: string, pattern: "^[a-zA-Z]{2}$" }
      responses:
        "200":
          description: Up to five formatted addresses and provider attribution. No cart changes are made.
          headers:
            Cache-Control:
              schema: { type: string, example: "private, no-store" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [suggestions]
                    properties:
                      suggestions:
                        type: array
                        maxItems: 5
                        items: { type: string, maxLength: 500 }
                      attribution:
                        type: array
                        items:
                          type: object
                          required: [label, url]
                          properties:
                            label: { type: string }
                            url: { type: string, format: uri }
        "400": { description: Invalid search text or language. }
        "404": { description: Public shipping service offer unavailable. }
