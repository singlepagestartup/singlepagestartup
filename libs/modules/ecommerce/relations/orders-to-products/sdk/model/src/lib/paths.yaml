paths:
  /ecommerce/orders-to-products:
    get:
      tags:
        - "ecommerce-orders-to-products"
      summary: Get all entities
      description: Retrieve a list of all entities with optional filtering, sorting and pagination
      parameters:
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/query-builder/offset.yaml"
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/query-builder/limit.yaml"
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/query-builder/order-by.yaml"
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/query-builder/filters.yaml"
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/middleware/no-cache.yaml"
      responses:
        "200":
          description: List of entities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "ecommerce-orders-to-products.yaml"

    post:
      tags:
        - "ecommerce-orders-to-products"
      summary: Create a new entity
      description: Create a new entity
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  $ref: "ecommerce-orders-to-products-input.yaml"
              required:
                - data
      responses:
        "201":
          description: Created successfully
          content:
            application/json:
              schema:
                $ref: "ecommerce-orders-to-products.yaml"

  /ecommerce/orders-to-products/count:
    get:
      tags:
        - "ecommerce-orders-to-products"
      summary: Count entities
      description: Retrieve a count of all entities with optional filtering
      parameters:
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/query-builder/filters.yaml"
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/middleware/no-cache.yaml"
      responses:
        "200":
          description: Count of entities
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: integer

  /ecommerce/orders-to-products/{id}:
    get:
      tags:
        - "ecommerce-orders-to-products"
      summary: Get by ID
      description: Retrieve a specific entity by its ID
      parameters:
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/query-builder/id.yaml"
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/middleware/no-cache.yaml"
      responses:
        "200":
          description: Found successfully
          content:
            application/json:
              schema:
                $ref: "ecommerce-orders-to-products.yaml"

    patch:
      tags:
        - "ecommerce-orders-to-products"
      summary: Update entity
      description: Update a specific entity
      parameters:
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/query-builder/id.yaml"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  $ref: "ecommerce-orders-to-products-input.yaml"
              required:
                - data
      responses:
        "200":
          description: Updated successfully
          content:
            application/json:
              schema:
                $ref: "ecommerce-orders-to-products.yaml"

    delete:
      tags:
        - "ecommerce-orders-to-products"
      summary: Delete entity
      description: Delete a specific entity
      parameters:
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/query-builder/id.yaml"
      responses:
        "204":
          description: Deleted successfully
          content:
            application/json:
              schema:
                $ref: "ecommerce-orders-to-products.yaml"

  /ecommerce/orders-to-products/{id}/total:
    get:
      tags:
        - "ecommerce-orders-to-products"
      summary: Calculate an order line's totals per currency
      description: The default RBAC seed grants this route to Admin. Customers read their own priced lines through the Subject route.
      parameters:
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/query-builder/id.yaml"
      responses:
        "200":
          description: Calculated amounts and lines that could not be priced.
          content:
            application/json:
              schema:
                type: object
                required: [data, unpriced]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [total, billingModuleCurrency]
                      properties:
                        total:
                          type: number
                        billingModuleCurrency:
                          $ref: "../../../../../../../../../libs/modules/billing/models/currency/sdk/model/src/lib/billing-currency.yaml"
                  unpriced:
                    type: array
                    items:
                      type: object
                      required: [ordersToProductsId, productId, reason]
                      properties:
                        ordersToProductsId:
                          type: string
                          format: uuid
                        productId:
                          type: string
                          format: uuid
                        reason:
                          type: string
