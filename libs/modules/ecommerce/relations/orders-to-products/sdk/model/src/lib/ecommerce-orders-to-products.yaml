allOf:
  - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/repository/database/relation.yaml"
  - type: object
    properties:
      quantity:
        type: integer
        format: int32
        minimum: 1
        description: Quantity of the product in the order, a whole number of at least 1. The subject cart routes also refuse values above `quantityBounds.max` (1000) of the relation SDK model.
      orderId:
        type: string
        format: uuid
        description: Related order id
      productId:
        type: string
        format: uuid
        description: Related product id
    required:
      - quantity
      - orderId
      - productId
