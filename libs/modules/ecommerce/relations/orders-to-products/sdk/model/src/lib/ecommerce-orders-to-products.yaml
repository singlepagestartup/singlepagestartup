allOf:
  - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/repository/database/relation.yaml"
  - type: object
    properties:
      quantity:
        type: integer
        format: int32
        minimum: 1
        description: Quantity of the product in the order, a whole number of at least 1. The subject cart routes also refuse values above the configured ECOMMERCE_ORDER_LINE_MAX_QUANTITY (default 1000000).
      offerId:
        type: string
        format: uuid
        nullable: true
        description: Exact retail store offer; null on legacy rows
      parentLineId:
        type: string
        format: uuid
        nullable: true
        description: Primary order line for a selected service
      destination:
        type: object
        description: Address, region, pickupPointId and optional coordinates of the primary line
      recurrence:
        type: string
        enum: [first, each]
      selectionUpdatedAt:
        type: string
        format: date-time
      quoteVersion:
        type: string
        nullable: true
      quoteExpiresAt:
        type: string
        format: date-time
        nullable: true
      orderId:
        type: string
        format: uuid
        description: Related order id
      productId:
        type: string
        format: uuid
        description: Related product id
    required:
      - quantity
      - orderId
      - productId
