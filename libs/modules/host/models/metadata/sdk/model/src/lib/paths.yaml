paths:
  /host/metadata/preview:
    post:
      tags: ["host-metadata"]
      summary: Preview unsaved SEO fields for a public page
      description: Resolves Metadata masks without saving the draft. Hidden and private pages are rejected. The response is no-store and noindex.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, language, metadata]
              properties:
                url:
                  type: string
                  example: /ru/blog/articles/example
                language:
                  type: string
                  example: ru
                metadata:
                  type: object
                  description: Partial Metadata record containing current form values and optional existing Metadata id.
                  additionalProperties: true
      responses:
        "200":
          description: Data envelope containing serializable metadata, structuredData and mask diagnostics.
        "400":
          description: Invalid JSON, Metadata masks or locale.
        "404":
          description: Public page or required public content is missing.
        "413":
          description: Request exceeds 64 KiB.
        "503":
          description: Upstream content is unavailable.

  /host/metadata/seo:
    get:
      tags: ["host-metadata"]
      summary: Resolve a Page and its SEO using public content
      description: Receives a pathname without a locale prefix. Uses the same Metadata service as draft preview.
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
          example: /blog/articles/example
        - name: language
          in: query
          required: true
          schema:
            type: string
          example: ru
      responses:
        "200":
          description: Data envelope containing Page, serializable metadata, structuredData and diagnostics.
        "400":
          description: Invalid pathname or locale.
        "404":
          description: Page or required public content is missing.

  /host/metadata:
    get:
      tags:
        - "host-metadata"
      summary: Get all entities
      description: Retrieve a list of all website entities with optional filtering, sorting and pagination
      parameters:
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/query-builder/offset.yaml"
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/query-builder/limit.yaml"
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/query-builder/order-by.yaml"
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/query-builder/filters.yaml"
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/middleware/no-cache.yaml"
      responses:
        "200":
          description: List of entities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "host-metadata.yaml"

    post:
      tags:
        - "host-metadata"
      summary: Create a new entity
      description: Create a new entity
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  $ref: "host-metadata-input.yaml"
              required:
                - data
      responses:
        "201":
          description: Created successfully
          content:
            application/json:
              schema:
                $ref: "host-metadata.yaml"

  /host/metadata/count:
    get:
      tags:
        - "host-metadata"
      summary: Count entities
      description: Retrieve a count of all entities with optional filtering
      parameters:
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/query-builder/filters.yaml"
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/middleware/no-cache.yaml"
      responses:
        "200":
          description: Count of entities
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: integer

  /host/metadata/{id}:
    get:
      tags:
        - "host-metadata"
      summary: Get by ID
      description: Retrieve a specific entity by its ID
      parameters:
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/query-builder/id.yaml"
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/middleware/no-cache.yaml"
      responses:
        "200":
          description: Found successfully
          content:
            application/json:
              schema:
                $ref: "host-metadata.yaml"

    patch:
      tags:
        - "host-metadata"
      summary: Update page
      description: Update a specific entity
      parameters:
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/query-builder/id.yaml"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  $ref: "host-metadata-input.yaml"
              required:
                - data
      responses:
        "200":
          description: Updated successfully
          content:
            application/json:
              schema:
                $ref: "host-metadata.yaml"

    delete:
      tags:
        - "host-metadata"
      summary: Delete page
      description: Delete a specific page
      parameters:
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/query-builder/id.yaml"
      responses:
        "204":
          description: Deleted successfully
          content:
            application/json:
              schema:
                $ref: "host-metadata.yaml"
