paths:
  /rbac/actions:
    get:
      tags:
        - "rbac-action"
      summary: Get all entities
      description: Retrieve a list of all entities with optional filtering, sorting and pagination
      parameters:
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/query-builder/offset.yaml"
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/query-builder/limit.yaml"
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/query-builder/order-by.yaml"
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/query-builder/filters.yaml"
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/middleware/no-cache.yaml"
      responses:
        "200":
          description: List of entities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "rbac-action.yaml"

    post:
      tags:
        - "rbac-action"
      summary: Create a new entity
      description: Create a new entity
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  $ref: "rbac-action-input.yaml"
              required:
                - data
      responses:
        "201":
          description: Created successfully
          content:
            application/json:
              schema:
                $ref: "rbac-action.yaml"

  /rbac/actions/count:
    get:
      tags:
        - "rbac-action"
      summary: Count entities
      description: Retrieve a count of all entities with optional filtering
      parameters:
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/query-builder/filters.yaml"
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/middleware/no-cache.yaml"
      responses:
        "200":
          description: Count of entities
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: integer

  /rbac/actions/{id}:
    get:
      tags:
        - "rbac-action"
      summary: Get by ID
      description: Retrieve a specific entity by its ID
      parameters:
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/query-builder/id.yaml"
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/middleware/no-cache.yaml"
      responses:
        "200":
          description: Found successfully
          content:
            application/json:
              schema:
                $ref: "rbac-action.yaml"

    patch:
      tags:
        - "rbac-action"
      summary: Update entity
      description: Update a specific entity
      parameters:
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/query-builder/id.yaml"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  $ref: "rbac-action-input.yaml"
              required:
                - data
      responses:
        "200":
          description: Updated successfully
          content:
            application/json:
              schema:
                $ref: "rbac-action.yaml"

    delete:
      tags:
        - "rbac-action"
      summary: Delete entity
      description: Delete a specific entity
      parameters:
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/query-builder/id.yaml"
      responses:
        "204":
          description: Deleted successfully
          content:
            application/json:
              schema:
                $ref: "rbac-action.yaml"

  /rbac/actions/{id}/consume:
    post:
      tags:
        - "rbac-action"
      summary: Consume entity
      description: >-
        Claim an action row in a single conditional write. The row is updated
        only while it still matches `filters`, so a caller that must act once -
        an OAuth state, an OAuth exchange code - cannot be raced into acting
        twice. Answers with `data: null` when nothing matched.
      parameters:
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/query-builder/id.yaml"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  type: string
                  description: JSON string carrying the patch and the predicate
                  example: '{"data":{"consumedAt":"2026-09-20T10:00:00.000Z"},"filters":{"and":[{"column":"consumedAt","method":"isNull"}]}}'
              required:
                - data
      responses:
        "200":
          description: The claimed entity, or null when the predicate no longer held
          content:
            application/json:
              schema:
                $ref: "rbac-action.yaml"
