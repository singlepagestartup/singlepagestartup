  /rbac/subjects/{id}/ecommerce-module/orders/{orderId}/selection:
    post:
      tags: [rbac-subject]
      summary: Price and save the current buyer's cart selection
      parameters: *a1
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: string
                  description: JSON containing action (save, preview or apply), the primary lineId, and exactly one entry in selections with offerId, quantity, currencyId, optional destination and services. A write requires the primary line's expectedSelectionUpdatedAt. Apply also requires expectedVersions from a preview. Omitted or empty services use the server's fulfillment default, which a successful save persists as a child line. Pickup uses the selected retail store and needs no destination; legacy pickupPointId values are ignored.
      responses:
        "200":
          description: Itemized server quotes. An incomplete save returns quote issues and applied=false. A successful save returns the revision to use for the next edit.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [quotes, orderIds, applied]
                    properties:
                      quotes: &cartSelectionQuotes
                        type: array
                        items:
                          {
                            $ref: "../../../../../../../../../libs/modules/ecommerce/relations/stores-to-products/sdk/model/src/lib/offer-quote.yaml",
                          }
                      comparisonQuotes: *cartSelectionQuotes
                      orderIds:
                        { type: array, items: { type: string, format: uuid } }
                      applied: { type: boolean }
                      selectionUpdatedAt: { type: string, format: date-time }
        "400": { description: Invalid cart selection }
        "403": { description: Cart access denied }
        "409":
          {
            description: Cart revision,
            payment state or offer conditions changed,
          }
  /rbac/subjects/{id}/ecommerce-module/offers:
    post:
      tags: [rbac-subject]
      summary: Atomically create a seller offer
      description: Requires the current signed-in Subject. Creates an offer for an existing Product or a new Product with its owner grant, formula, first offer, prices and stock. Store ownership is required; an existing Product keeps its owner.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              additionalProperties: false
              properties:
                data:
                  $ref: ecommerce-catalog-offer-input.yaml
      responses:
        "201":
          description: Product and store offer
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      product:
                        $ref: ../../../../../../../ecommerce/models/product/sdk/model/src/lib/ecommerce-product.yaml
                      offer:
                        type: object
                        description: The stored Store–Product offer with its UUID and unique SKU.
        "400":
          { description: Invalid product, prices, stock or store selection }
        "401": { description: A signed-in Subject is required }
        "403": { description: The Subject does not own the store }
  /rbac/subjects/{id}/ecommerce-module/catalogue-attributes:
    post:
      tags: [rbac-subject]
      summary: Set an owned catalogue attribute
      description: Creates or updates one scoped Store rate, Product formula or offer price/stock. The server verifies all attribute owners; stock changes lock the offer and retain active reservations.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              additionalProperties: false
              properties:
                data:
                  $ref: ecommerce-catalog-attribute-input.yaml
      responses:
        "200": { description: Stored Attribute }
        "400": { description: Invalid or ambiguous attribute, formula or stock }
        "401": { description: A signed-in Subject is required }
        "403": { description: Catalogue ownership is required }
  /rbac/subjects/{id}/ecommerce-module/catalogue-context:
    get:
      tags: [rbac-subject]
      summary: Read the current seller catalogue context
      description: Returns only writable stores, up to 200 published Product choices and the available currencies. The caller must match the Subject; administrators can choose any store.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          { description: Stores, products and currencies for the seller form }
        "401": { description: A signed-in Subject is required }
        "403": { description: The requested Subject does not match the caller }

  /rbac/subjects/{id}/ecommerce-module/catalogue-mutations:
    post:
      tags: [rbac-subject]
      summary: Change an owned catalogue record
      description: Requires the current signed-in Subject and normal route permission. The Subject service validates the owning entity schema and checks catalogue ownership before writing. Ownership grants require an administrator.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              additionalProperties: false
              properties:
                data:
                  type: object
                  required: [entity, method]
                  additionalProperties: false
                  properties:
                    entity:
                      type: string
                      enum:
                        [
                          stores,
                          products,
                          attributes,
                          attribute-keys,
                          stores-to-products,
                          offers-to-offers,
                          stores-to-attributes,
                          products-to-attributes,
                          stores-to-products-to-attributes,
                          attribute-keys-to-attributes,
                          attributes-to-billing-module-currencies,
                          subjects-to-ecommerce-module-stores,
                          subjects-to-ecommerce-module-products,
                          subjects-to-ecommerce-module-orders,
                        ]
                    method: { type: string, enum: [POST, PATCH, DELETE] }
                    recordId: { type: string, format: uuid }
                    data: { type: object, additionalProperties: true }
      responses:
        "200": { description: Updated or deleted catalogue record }
        "201":
          {
            description: Created catalogue record and current Subject ownership when applicable,
          }
        "400": { description: Invalid record values or unavailable stock }
        "401": { description: A signed-in Subject is required }
        "403": { description: Permission or catalogue ownership is required }

  /rbac/subjects/ecommerce-module/orders/payment-intents/{id}/providers/{provider}:
    post:
      tags:
        - "rbac-subject"
      summary: Payment intent provider
      description: Dispatch an existing order payment intent. Requires the operator credential.
      parameters:
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/query-builder/id.yaml"
        - name: provider
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  type: string
                  description: JSON string
                  example: '{"provider": "stripe", "currencyId": "00000000-0000-0000-0000-000000000000", "metadata": {"email": "user@example.com"}}'
              required:
                - data
      responses:
        "201":
          description: Payment intent
          content:
            application/json:
              schema:
                $ref: "../../../../../../../../../libs/modules/billing/models/payment-intent/sdk/model/src/lib/billing-payment-intent.yaml"

  /rbac/subjects/ecommerce-module/orders/payment-intents/{provider}/webhook:
    post:
      tags:
        - "rbac-subject"
      summary: Payment intent provider webhook
      description: Authenticate the callback for the provider in the URL and apply it to the linked order payment.
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
          application/x-www-form-urlencoded:
            schema: { type: object, additionalProperties: true }
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  type: string
                  description: JSON string
                  example: '{"provider": "telegram-star", "currency": "USD", "total_amount": 0, "invoice_payload": "payload", "telegram_payment_charge_id": "charge", "provider_payment_charge_id": "provider_charge"}'
              required:
                - data
      responses:
        "200":
          description: Provider acknowledgment after authenticated processing
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      code:
                        type: integer
                        enum: [0]
                    required: [code]
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          code:
                            type: integer
                            enum: [0]
                          ok:
                            type: boolean
                          received:
                            type: boolean
                    required: [data]
            text/plain:
              schema:
                type: string
                description: PayKeeper acknowledgment

  /rbac/subjects/ecommerce-module/orders/payment-intents/{id}/check:
    post:
      tags:
        - "rbac-subject"
      summary: Check payment intent
      description: Reconcile the order payment with its provider. Requires the operator credential.
      parameters:
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/query-builder/id.yaml"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  type: string
                  description: JSON string
                  example: "{}"
              required:
                - data
      responses:
        "200":
          description: Payment intent
          content:
            application/json:
              schema:
                $ref: "../../../../../../../../../libs/modules/billing/models/payment-intent/sdk/model/src/lib/billing-payment-intent.yaml"
  /rbac/subjects/{id}/stores/{storeId}/provider-connections:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: storeId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [rbac-subject]
      summary: Read a store owner's connections, assistants and wallet receipts
      parameters:
        - { name: before, in: query, required: false, schema: { type: string, format: uuid }, description: Return receipts older than the last ID on the previous page }
      responses:
        "200": { description: Private owner-scoped metadata and charges }
        "403": { description: Store ownership required }
    post:
      tags: [rbac-subject]
      summary: Configure a provider connection or resolve an unknown external charge
      description: The authenticated store owner supplies the command in data. New credentials are write-only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  required: [operation, storeId]
                  properties:
                    operation: { type: string, enum: [connect, rotate, revoke, assign, assign-default, fund, reconcile] }
                    storeId: { type: string, format: uuid }
                    secret: { type: string, writeOnly: true }
      responses:
        "200": { description: ID of the affected record }
        "409": { description: Stale version or incompatible financial state }
  /rbac/subjects/{id}/stores/{storeId}/customer-work:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: storeId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [rbac-subject]
      summary: Read the buyer's scoped task or available workflows for an offer
      responses:
        "200": { description: Customer work view or offer availability }
    post:
      tags: [rbac-subject]
      summary: Start a conversation, send a message or update task consent and customer memory
      description: The open-cart-discussion operation attaches a task and thread to an existing order using orderId, productId, offerId, storeId and operationKey.
      responses:
        "200": { description: Updated task and thread }
        "409": { description: Operation key conflicts with an earlier request }
  /rbac/subjects/{id}/customer-work/threads/{threadId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: threadId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [rbac-subject]
      summary: Read the task conversation available to the signed-in buyer
      responses:
        "200": { description: "Task, published funnel and current stage names, and current assignment" }
  /rbac/subjects/{id}/customer-work/threads/{threadId}/messages/{messageId}/attachments/{attachmentId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: threadId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: messageId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: attachmentId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [rbac-subject]
      summary: Download a private attachment from the buyer's thread
      responses:
        "200":
          description: Opaque attachment
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { description: Attachment is outside the requested buyer or message scope }
    head:
      tags: [rbac-subject]
      summary: Read the private attachment download headers
      responses:
        "200": { description: Attachment headers }
        "404": { description: Attachment is outside the requested buyer or message scope }
  /rbac/subjects/{id}/crm-module/workspace/stores:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [rbac-subject]
      summary: List stores managed by the signed-in subject
      responses:
        "200": { description: Scoped result }
        "401": { description: A signed-in subject is required }
  /rbac/subjects/{id}/crm-module/workspace/options:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: storeId, in: query, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [rbac-subject]
      summary: List participants and currencies for the store
      responses:
        "200": { description: Scoped result }
        "401": { description: A signed-in subject is required }
  /rbac/subjects/{id}/crm-module/workspace/funnels:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: storeId, in: query, required: true, schema: { type: string, format: uuid } }
      - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
      - { name: cursor, in: query, required: false, schema: { type: string } }
    get:
      tags: [rbac-subject]
      summary: List store funnels
      responses:
        "200": { description: Scoped result }
        "401": { description: A signed-in subject is required }
  /rbac/subjects/{id}/crm-module/workspace/publications:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: storeId, in: query, required: true, schema: { type: string, format: uuid } }
      - { name: funnelId, in: query, required: true, schema: { type: string, format: uuid } }
      - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
      - { name: cursor, in: query, required: false, schema: { type: string } }
    get:
      tags: [rbac-subject]
      summary: Read published versions of a funnel
      responses:
        "200": { description: Scoped result }
        "401": { description: A signed-in subject is required }
  /rbac/subjects/{id}/crm-module/workspace/tasks:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: storeId, in: query, required: true, schema: { type: string, format: uuid } }
      - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
      - { name: cursor, in: query, required: false, schema: { type: string } }
      - { name: status, in: query, required: false, schema: { type: string, enum: [active, waiting, closed] } }
      - { name: stageId, in: query, required: false, schema: { type: string } }
      - { name: search, in: query, required: false, schema: { type: string } }
    get:
      tags: [rbac-subject]
      summary: Filter the task list used by the board and table
      responses:
        "200": { description: Scoped result }
        "401": { description: A signed-in subject is required }
  /rbac/subjects/{id}/crm-module/workspace/detail:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: storeId, in: query, required: true, schema: { type: string, format: uuid } }
      - { name: taskId, in: query, required: true, schema: { type: string, format: uuid } }
      - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
      - { name: cursor, in: query, required: false, schema: { type: string } }
    get:
      tags: [rbac-subject]
      summary: Read the task and its event history
      responses:
        "200": { description: Scoped result }
        "401": { description: A signed-in subject is required }
  /rbac/subjects/{id}/crm-module/workspace/command:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [rbac-subject]
      summary: Publish a funnel or update a task as its authorized manager
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  required: [kind]
                  properties:
                    kind: { type: string, enum: [save, publish, transition, assign, fulfill] }
      responses:
        "200": { description: Scoped result }
        "401": { description: A signed-in subject is required }
        "409": { description: The resource changed or the requested action conflicts with its current state }
  /rbac/subjects/{id}/ecommerce-module/orders/{orderId}/work:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [rbac-subject]
      summary: Read the buyer's order task and available artifacts
      parameters:
        - { name: storeId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: taskId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Scoped result }
        "401": { description: A signed-in subject is required }
    post:
      tags: [rbac-subject]
      summary: Accept a result version or request a revision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operation, storeId, taskId, resultVersionId, operationKey]
              properties:
                storeId: { type: string, format: uuid }
                taskId: { type: string, format: uuid }
                operationKey: { type: string }
                operation: { type: string, enum: [accept, decline] }
                resultVersionId: { type: string, format: uuid }
                reason: { type: string, description: Required when declining a version }
      responses:
        "200": { description: Scoped result }
        "401": { description: A signed-in subject is required }
        "409": { description: The resource changed or the requested action conflicts with its current state }
  /rbac/subjects/{id}/ecommerce-module/orders/{orderId}/work/fulfillment:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [rbac-subject]
      summary: Record preparation or shipping evidence for the assigned physical order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [storeId, taskId, operationKey, stage]
              properties:
                storeId: { type: string, format: uuid }
                taskId: { type: string, format: uuid }
                operationKey: { type: string }
                stage: { type: string, enum: [preparing, in-transit, delivered] }
                trackingNumber: { type: string }
                carrierEvidenceId: { type: string }
      responses:
        "200": { description: Scoped result }
        "401": { description: A signed-in subject is required }
        "409": { description: The resource changed or the requested action conflicts with its current state }
  /rbac/subjects/{id}/ecommerce-module/orders/{orderId}/work/artifacts/{artifactId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: artifactId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [rbac-subject]
      summary: Download an authorized preview, original or receipt
      responses:
        "200": { description: Private file bytes with no-store caching }
        "401": { description: A signed-in subject is required }
    head:
      tags: [rbac-subject]
      summary: Read metadata for an authorized order artifact
      responses:
        "200": { description: File headers with private no-store caching }
        "401": { description: A signed-in subject is required }
