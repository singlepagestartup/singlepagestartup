paths:
  /rbac/subjects:
    get:
      tags:
        - "rbac-subject"
      summary: Get all entities
      description: Retrieve a list of all entities with optional filtering, sorting and pagination
      parameters:
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/query-builder/offset.yaml"
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/query-builder/limit.yaml"
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/query-builder/order-by.yaml"
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/query-builder/filters.yaml"
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/middleware/no-cache.yaml"
      responses:
        "200":
          description: List of entities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "rbac-subject.yaml"

    post:
      tags:
        - "rbac-subject"
      summary: Create a new entity
      description: Create a new entity
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  $ref: "rbac-subject-input.yaml"
              required:
                - data
      responses:
        "201":
          description: Created successfully
          content:
            application/json:
              schema:
                $ref: "rbac-subject.yaml"

  /rbac/subjects/count:
    get:
      tags:
        - "rbac-subject"
      summary: Count entities
      description: Retrieve a count of all entities with optional filtering
      parameters:
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/query-builder/filters.yaml"
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/middleware/no-cache.yaml"
      responses:
        "200":
          description: Count of entities
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: integer

  /rbac/subjects/{id}:
    get:
      tags:
        - "rbac-subject"
      summary: Get by ID
      description: Retrieve a specific entity by its ID
      parameters:
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/query-builder/id.yaml"
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/middleware/no-cache.yaml"
      responses:
        "200":
          description: Found successfully
          content:
            application/json:
              schema:
                $ref: "rbac-subject.yaml"

    patch:
      tags:
        - "rbac-subject"
      summary: Update entity
      description: Update a specific entity
      parameters:
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/query-builder/id.yaml"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  $ref: "rbac-subject-input.yaml"
              required:
                - data
      responses:
        "200":
          description: Updated successfully
          content:
            application/json:
              schema:
                $ref: "rbac-subject.yaml"

    delete:
      tags:
        - "rbac-subject"
      summary: Delete entity
      description: Delete a specific entity
      parameters:
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/query-builder/id.yaml"
      responses:
        "204":
          description: Deleted successfully
          content:
            application/json:
              schema:
                $ref: "rbac-subject.yaml"

  /rbac/subjects/{id}/notify:
    post:
      tags:
        - "rbac-subject"
      summary: Notify subject
      description: Send notification to subject
      parameters:
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/query-builder/id.yaml"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  type: string
                  description: JSON string
                  example: "{}"
              required:
                - data
      responses:
        "200":
          description: Notification result
          content:
            application/json:
              schema:
                type: object
                nullable: true
                properties:
                  notificationService:
                    type: object
                    properties:
                      notifications:
                        type: array
                        items:
                          $ref: "../../../../../../../../../libs/modules/notification/models/notification/sdk/model/src/lib/notification-module-notification.yaml"

  /rbac/subjects/check:
    post:
      tags:
        - "rbac-subject"
      summary: Check subjects
      description: Check subject orders and update roles
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  type: string
                  description: JSON string
                  example: "{}"
      responses:
        "200":
          description: Check result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                    required:
                      - ok
                required:
                  - data

  /rbac/subjects/delete-anonymous:
    post:
      tags:
        - "rbac-subject"
      summary: Delete anonymous subjects
      description: Delete one bounded batch of inactive anonymous subjects that own nothing
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  type: string
                  description: JSON string
                  example: "{}"
      responses:
        "200":
          description: Cleanup counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      scanned:
                        type: integer
                      deleted:
                        type: integer
                      failed:
                        type: integer
                      retained:
                        type: integer
                      retainedByReason:
                        type: object
                        additionalProperties:
                          type: integer
                    required:
                      - scanned
                      - deleted
                      - failed
                      - retained
                required:
                  - data

  /rbac/subjects/{id}/check:
    post:
      tags:
        - "rbac-subject"
      summary: Check one subject
      description: Check one subject orders and update roles
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  type: string
                  description: JSON string
                  example: "{}"
      responses:
        "200":
          description: Check result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                    required:
                      - ok
                required:
                  - data

  /rbac/subjects/telegram/bootstrap:
    post:
      tags:
        - "rbac-subject"
      summary: Telegram bootstrap
      description: Find or create telegram subject/profile/chat in one request
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  type: string
                  description: JSON string
                  example: '{"telegram":{"fromId":"1","chatId":"1","messageText":"/start"}}'
              required:
                - data
      responses:
        "200":
          description: Bootstrap result
          content:
            application/json:
              schema:
                type: object

  /rbac/subjects/{id}/telegram/sync-membership:
    post:
      tags:
        - "rbac-subject"
      summary: Telegram role sync
      description: Synchronize subject roles for telegram membership and registration defaults
      parameters:
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/query-builder/id.yaml"
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  type: string
                  description: JSON string
                  example: '{"memberStatus":"member"}'
      responses:
        "200":
          description: Role synchronization result
          content:
            application/json:
              schema:
                type: object

  /rbac/subjects/{id}/telegram/checkout-free-subscription:
    post:
      tags:
        - "rbac-subject"
      summary: Telegram free subscription checkout
      description: Checkout free subscription product for telegram subject if available
      parameters:
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/query-builder/id.yaml"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  type: string
                  description: JSON string
                  example: '{"chatId":"1"}'
              required:
                - data
      responses:
        "200":
          description: Checkout result
          content:
            application/json:
              schema:
                type: object

  /rbac/subjects/{id}/identities:
    get:
      tags:
        - "rbac-subject"
      summary: List identities
      description: Retrieve identities for a subject
      parameters:
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/query-builder/id.yaml"
      responses:
        "200":
          description: List of identities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "../../../../../../../../../libs/modules/rbac/models/identity/sdk/model/src/lib/rbac-identity.yaml"

    post:
      tags:
        - "rbac-subject"
      summary: Create identity
      description: Create identity for a subject
      parameters:
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/query-builder/id.yaml"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  type: string
                  description: JSON string
                  example: "{}"
              required:
                - data
      responses:
        "200":
          description: Updated subject
          content:
            application/json:
              schema:
                $ref: "rbac-subject.yaml"

  /rbac/subjects/{id}/identities/{identityId}:
    patch:
      tags:
        - "rbac-subject"
      summary: Update identity
      description: Update identity for a subject
      parameters:
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/query-builder/id.yaml"
        - name: identityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  type: string
                  description: JSON string
                  example: "{}"
              required:
                - data
      responses:
        "200":
          description: Updated subject
          content:
            application/json:
              schema:
                $ref: "rbac-subject.yaml"

    delete:
      tags:
        - "rbac-subject"
      summary: Delete identity
      description: Delete identity for a subject
      parameters:
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/query-builder/id.yaml"
        - name: identityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Updated subject
          content:
            application/json:
              schema:
                $ref: "rbac-subject.yaml"

  /rbac/subjects/authentication/me:
    get:
      tags:
        - "rbac-subject"
      summary: Authentication me
      description: The stored subject of the presented access token; null without a token or when the subject no longer exists. A refresh token or a token revoked by logout is refused with 401.
      responses:
        "200":
          description: Current subject
          content:
            application/json:
              schema:
                $ref: "rbac-subject.yaml"
                nullable: true

  /rbac/subjects/authentication/init:
    get:
      tags:
        - "rbac-subject"
      summary: Authentication init
      description: Initialize authentication session
      responses:
        "200":
          description: Tokens
          content:
            application/json:
              schema:
                type: object
                properties:
                  jwt:
                    type: string
                  refresh:
                    type: string
                required:
                  - jwt
                  - refresh

  /rbac/subjects/authentication/logout:
    post:
      tags:
        - "rbac-subject"
      summary: Authentication logout
      description: Revoke every token of the presented access token's subject. Without a valid access token nothing is revoked and the answer is the same.
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok

  /rbac/subjects/authentication/refresh:
    post:
      tags:
        - "rbac-subject"
      summary: Authentication refresh
      description: Exchange a refresh token for a new token pair. An access token or a refresh token revoked by logout is refused with 401.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  type: string
                  description: JSON string
                  example: '{"refresh": "refresh-token"}'
              required:
                - data
      responses:
        "200":
          description: Tokens
          content:
            application/json:
              schema:
                type: object
                properties:
                  jwt:
                    type: string
                  refresh:
                    type: string
                required:
                  - jwt
                  - refresh

  /rbac/subjects/authentication/oauth/{provider}:
    post:
      tags:
        - "rbac-subject"
      summary: OAuth start
      description: Start OAuth flow and get provider authorization URL
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            example: google
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  type: string
                  description: JSON string
                  example: '{"flow":"signin","redirectTo":"/rbac/subject/authentication/oauth/callback"}'
      responses:
        "200":
          description: OAuth state and authorization URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  state:
                    type: string
                    format: uuid
                  authorizationUrl:
                    type: string
                required:
                  - state
                  - authorizationUrl

  /rbac/subjects/authentication/oauth/{provider}/callback:
    get:
      tags:
        - "rbac-subject"
      summary: OAuth callback
      description: >-
        Provider callback endpoint. Redirects to a path on the host origin only.
        On success the landing URL carries `oauthExchange=<provider>` and the
        exchange code is set as the HttpOnly `rbac.oauth.exchange-code` cookie;
        on failure it carries `oauthError=<code>`. The exchange code is also put
        in the `code` query parameter while `RBAC_OAUTH_EXCHANGE_CODE_IN_QUERY`
        is on.
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            example: google
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
        - name: error_description
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect to host callback route

  /rbac/subjects/authentication/oauth/exchange:
    post:
      tags:
        - "rbac-subject"
      summary: OAuth exchange
      description: >-
        Exchange a one-time OAuth code for JWT and refresh tokens. The code is
        read from the HttpOnly `rbac.oauth.exchange-code` cookie set by the
        callback; the request body is read only while
        `RBAC_OAUTH_EXCHANGE_CODE_IN_QUERY` is on. The code is single use: a
        second redemption answers 401.
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  type: string
                  description: >-
                    JSON string. Only read while
                    RBAC_OAUTH_EXCHANGE_CODE_IN_QUERY is on.
                  example: '{"code":"00000000-0000-0000-0000-000000000000"}'
      responses:
        "200":
          description: Tokens
          content:
            application/json:
              schema:
                type: object
                properties:
                  jwt:
                    type: string
                  refresh:
                    type: string
                required:
                  - jwt
                  - refresh

  /rbac/subjects/authentication/is-authorized:
    get:
      tags:
        - "rbac-subject"
      summary: Authentication is authorized
      description: Check permissions for a route
      parameters:
        - name: permission
          in: query
          required: true
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              route:
                type: string
              method:
                type: string
              type:
                type: string
            required:
              - route
              - method
      responses:
        "200":
          description: Authorization result
          content:
            application/json:
              schema:
                type: object
                nullable: true
                properties:
                  ok:
                    type: boolean

  /rbac/subjects/authentication/ethereum-virtual-machine:
    post:
      tags:
        - "rbac-subject"
      summary: Authentication EVM
      description: Authenticate using Ethereum signature
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  type: string
                  description: JSON string
                  example: '{"address": "0x0000000000000000000000000000000000000000", "message": "message", "signature": "0xsignature"}'
              required:
                - data
      responses:
        "200":
          description: Tokens
          content:
            application/json:
              schema:
                type: object
                properties:
                  jwt:
                    type: string
                  refresh:
                    type: string
                required:
                  - jwt
                  - refresh

  /rbac/subjects/authentication/email-and-password/authentication:
    post:
      tags:
        - "rbac-subject"
      summary: Authentication by email and password
      description: Authenticate using email and password
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  type: string
                  description: JSON string
                  example: '{"login": "user@example.com", "password": "Password123!"}'
              required:
                - data
      responses:
        "200":
          description: Tokens
          content:
            application/json:
              schema:
                type: object
                properties:
                  jwt:
                    type: string
                  refresh:
                    type: string
                required:
                  - jwt
                  - refresh

  /rbac/subjects/authentication/email-and-password/registration:
    post:
      tags:
        - "rbac-subject"
      summary: Registration by email and password
      description: Register using email and password
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  type: string
                  description: JSON string
                  example: '{"login": "user@example.com", "password": "Password123!"}'
              required:
                - data
      responses:
        "200":
          description: Tokens
          content:
            application/json:
              schema:
                type: object
                properties:
                  jwt:
                    type: string
                  refresh:
                    type: string
                required:
                  - jwt
                  - refresh

  /rbac/subjects/authentication/email-and-password/forgot-password:
    post:
      tags:
        - "rbac-subject"
      summary: Forgot password
      description: Request password reset
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  type: string
                  description: JSON string
                  example: '{"email": "user@example.com"}'
              required:
                - data
      responses:
        "200":
          description: Reset requested
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok

  /rbac/subjects/authentication/email-and-password/reset-password:
    post:
      tags:
        - "rbac-subject"
      summary: Reset password
      description: Reset password using code
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  type: string
                  description: JSON string
                  example: '{"password": "Password123!", "passwordConfirmation": "Password123!", "code": "reset-code"}'
              required:
                - data
      responses:
        "200":
          description: Reset result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok

  /rbac/subjects/{id}/ecommerce-module/products/{productId}/checkout:
    post:
      tags:
        - "rbac-subject"
      summary: Checkout product
      description: Re-quote one configured retail offer, create its order and check out only that order. Existing cart orders are not included. An offer already in the cart must be purchased through its saved order checkout.
      parameters:
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/query-builder/id.yaml"
        - name: productId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  type: string
                  description: >-
                    Serialized JSON with provider and optional email, account, offerId,
                    storeId, quantity, expectedQuoteVersion, comment, destination and services.
                    destination contains a delivery address, region and optional coordinates
                    {latitude, longitude}. Pickup takes place at the selected retail store
                    and needs no address or point ID. Legacy pickupPointId values are ignored.
                    services is an array of {offerId, quantity}.
                    Currency is billingModule.currency.id; billingModuleCurrencyId is also accepted.
                    Supply expectedQuoteVersion from the exact product-page quote to reject changed
                    terms before writes. Legacy calls may omit the offer when only one is available
                    and omit currency to use an available default.
                  example: '{"provider":"stripe","email":"buyer@example.com","offerId":"00000000-0000-0000-0000-000000000001","quantity":2,"billingModule":{"currency":{"id":"00000000-0000-0000-0000-000000000002"}},"destination":{"address":"City Street 10"},"services":[{"offerId":"00000000-0000-0000-0000-000000000003","quantity":1}],"expectedQuoteVersion":"server-quote-version"}'
              required:
                - data
      responses:
        "200":
          description: Checkout result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      billingModule:
                        type: object
                        properties:
                          invoices:
                            type: array
                            items:
                              $ref: "../../../../../../../../../libs/modules/billing/models/invoice/sdk/model/src/lib/billing-invoice.yaml"
        "400":
          description: Invalid or incomplete offer, quantity, currency, destination or service selection.
        "409":
          description: Quoted terms changed or this offer is already in the cart.

  /rbac/subjects/{id}/ecommerce-module/orders:
    get:
      tags:
        - "rbac-subject"
      summary: List orders
      description: Retrieve ecommerce orders for a subject
      parameters:
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/query-builder/id.yaml"
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "../../../../../../../../../libs/modules/ecommerce/models/order/sdk/model/src/lib/ecommerce-order.yaml"

    post:
      tags:
        - "rbac-subject"
      summary: Create order
      description: Re-quote and atomically add one exact retail offer with its selected services to the subject's cart. Existing callers may omit the offer when only one is available. Duplicate copies of the same offer are refused.
      parameters:
        - $ref: "../../../../../../../../../libs/shared/backend/api/src/lib/query-builder/id.yaml"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  type: string
                  description: >-
                    Serialized JSON with productId and optional offerId, storeId, quantity,
                    billingModuleCurrencyId (or billingModule.currency.id), expectedQuoteVersion,
                    destination, services and comment. destination contains a delivery address,
                    region and optional coordinates {latitude, longitude}. Pickup takes place at
                    the selected retail store and needs no address or point ID. Legacy
                    pickupPointId values are ignored.
                    services is an array of {offerId, quantity}. A supplied expectedQuoteVersion
                    must match the re-quoted selection before graph writes. The stored primary
                    line preserves the exact offer, destination and quantity; selected services
                    become child lines in the same order. Shipping selections without an address
                    may remain editable cart drafts.
                  example: '{"productId":"00000000-0000-0000-0000-000000000000","offerId":"00000000-0000-0000-0000-000000000001","quantity":2,"billingModuleCurrencyId":"00000000-0000-0000-0000-000000000002","destination":{"address":"City Street 10"},"services":[{"offerId":"00000000-0000-0000-0000-000000000003","quantity":1}],"expectedQuoteVersion":"server-quote-version"}'
              required:
                - data
      responses:
        "200":
          description: Updated subject
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "rbac-subject.yaml"
                  - type: object
                    properties:
                      subjectsToEcommerceModuleOrders:
                        type: array
