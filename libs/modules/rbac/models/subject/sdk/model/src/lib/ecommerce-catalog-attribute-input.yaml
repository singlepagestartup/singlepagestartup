$schema: https://json-schema.org/draft/2020-12/schema
type: object
properties:
  owner:
    type: object
    properties:
      type:
        type: string
        enum:
          - store
          - product
          - offer
      id:
        type: string
        format: uuid
        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
    required:
      - type
      - id
    additionalProperties: false
  key:
    type: string
    pattern: ^[a-z][a-z0-9_-]{0,99}$
  field:
    type: string
    enum:
      - number
      - string
  type:
    default: feature
    type: string
    maxLength: 100
  number:
    anyOf:
      - type: string
        maxLength: 100
        pattern: ^(0|[1-9]\d*)(\.\d{1,8})?$
      - type: number
        minimum: 0
  string:
    type: string
    maxLength: 2000
  currencyId:
    type: string
    format: uuid
    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
required:
  - owner
  - key
  - field
additionalProperties: false
